name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly link check, Mondays 06:00 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Learning paths are prerequisite-complete
        run: python scripts/check_paths.py
      - name: Reference manifest is valid
        run: python scripts/check_references.py
      - name: Lessons follow the template
        run: python scripts/check_lessons.py
      - name: Lesson code tests against the reference solutions
        run: pytest
        env:
          AEFS_IMPL: solution

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Every lesson renders to a page
        run: npm run build
        working-directory: site

  links:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reference links respond (reachability only, not content verification)
        run: python scripts/check_references.py --links
