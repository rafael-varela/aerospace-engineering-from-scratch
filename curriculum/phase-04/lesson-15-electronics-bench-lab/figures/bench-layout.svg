<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title">
  <title id="title">Schematic of the bench layout: three branches between the (+) rail (USB 5 V or 3.3 V) and the GND rail. Left, a divider R_t over R_b with a voltmeter across R_b. Middle, a 330 Ω resistor and an LED, with the ammeter inserted in series below the LED to measure current. Right, a thermistor divider: an NTC 10k thermistor in a zip bag in the mug over R_f 10k, with the midpoint going to ADC pin A.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="line" x1="60.0" y1="70.0" x2="680.0" y2="70.0"/>
  <line class="line" x1="60.0" y1="340.0" x2="680.0" y2="340.0"/>
  <text x="60.0" y="58.0" class="head">(+) rail: USB 5 V or 3.3 V</text>
  <text x="60.0" y="362.0" class="head">(−) rail: GND</text>
  <circle class="dot" cx="200.0" cy="70.0" r="3.5"/>
  <circle class="dot" cx="200.0" cy="340.0" r="3.5"/>
  <circle class="dot" cx="390.0" cy="70.0" r="3.5"/>
  <circle class="dot" cx="390.0" cy="340.0" r="3.5"/>
  <circle class="dot" cx="560.0" cy="70.0" r="3.5"/>
  <circle class="dot" cx="560.0" cy="340.0" r="3.5"/>
  <path class="line" d="M200.0,70.0 L200.0,115.5 L208.0,119.2 L192.0,126.5 L208.0,133.8 L192.0,141.2 L208.0,148.5 L192.0,155.8 L200.0,159.5 L200.0,205.0"/>
  <path class="line" d="M200.0,205.0 L200.0,250.5 L208.0,254.2 L192.0,261.5 L208.0,268.8 L192.0,276.2 L208.0,283.5 L192.0,290.8 L200.0,294.5 L200.0,340.0"/>
  <text x="216.0" y="142.5" class="sym">R<tspan dy="5" style="font-size:13px">t</tspan><tspan dy="-5"></tspan></text>
  <text x="216.0" y="277.5" class="sym">R<tspan dy="5" style="font-size:13px">b</tspan><tspan dy="-5"></tspan></text>
  <circle class="dot" cx="200.0" cy="205.0" r="3.5"/>
  <line class="line" x1="200.0" y1="205.0" x2="110.0" y2="205.0"/>
  <line class="line" x1="110.0" y1="205.0" x2="110.0" y2="252.0"/>
  <circle class="body" cx="110.0" cy="272.0" r="18"/>
  <text x="110.0" y="278.0" class="head" text-anchor="middle">V</text>
  <line class="line" x1="110.0" y1="292.0" x2="110.0" y2="340.0"/>
  <circle class="dot" cx="110.0" cy="340.0" r="3.5"/>
  <text x="84.0" y="276.0" class="note" text-anchor="end">meter</text>
  <path class="line" d="M390.0,70.0 L390.0,98.0 L398.0,101.7 L382.0,109.0 L398.0,116.3 L382.0,123.7 L398.0,131.0 L382.0,138.3 L390.0,142.0 L390.0,170.0"/>
  <text x="406.0" y="125.0">330 Ω</text>
  <line class="line" x1="390.0" y1="170.0" x2="390.0" y2="196.0"/>
  <path class="body" d="M377.0,196.0 L403.0,196.0 L390.0,224.0 L377.0,196.0"/>
  <line class="line" x1="377.0" y1="224.0" x2="403.0" y2="224.0"/>
  <line class="thin" x1="407.0" y1="202.0" x2="421.0" y2="192.0" marker-end="url(#ah-ink2)"/>
  <line class="thin" x1="407.0" y1="213.0" x2="421.0" y2="203.0" marker-end="url(#ah-ink2)"/>
  <text x="428.0" y="206.0">LED</text>
  <line class="line" x1="390.0" y1="224.0" x2="390.0" y2="256.0"/>
  <circle class="body" style="stroke-dasharray:4 3" cx="390.0" cy="276.0" r="18"/>
  <text x="390.0" y="282.0" class="head" text-anchor="middle">A</text>
  <line class="line" x1="390.0" y1="296.0" x2="390.0" y2="340.0"/>
  <text x="416.0" y="272.0" class="note">ammeter in series</text>
  <text x="416.0" y="289.0" class="note">here for current</text>
  <path class="line" d="M560.0,70.0 L560.0,115.5 L568.0,119.2 L552.0,126.5 L568.0,133.8 L552.0,141.2 L568.0,148.5 L552.0,155.8 L560.0,159.5 L560.0,205.0"/>
  <line class="line" x1="544.0" y1="153.5" x2="576.0" y2="121.5"/>
  <line class="line" x1="544.0" y1="153.5" x2="536.0" y2="153.5"/>
  <text x="578.0" y="133.5">NTC 10k</text>
  <text x="578.0" y="150.5" class="note">in a zip bag in the mug</text>
  <path class="line" d="M560.0,205.0 L560.0,250.5 L568.0,254.2 L552.0,261.5 L568.0,268.8 L552.0,276.2 L568.0,283.5 L552.0,290.8 L560.0,294.5 L560.0,340.0"/>
  <text x="576.0" y="277.5" class="sym">R<tspan dy="5" style="font-size:13px">f</tspan><tspan dy="-5"></tspan></text>
  <text x="602.0" y="277.5">10k</text>
  <circle class="dot" cx="560.0" cy="205.0" r="3.5"/>
  <line class="line" x1="560.0" y1="205.0" x2="660.0" y2="205.0"/>
  <circle class="body" cx="660.0" cy="205.0" r="5"/>
  <text x="660.0" y="191.0" text-anchor="end">ADC pin (A)</text>
  <text x="180.0" y="388.0" text-anchor="middle">divider</text>
  <text x="390.0" y="388.0" text-anchor="middle">LED</text>
  <text x="560.0" y="388.0" text-anchor="middle">thermistor divider</text>
  <text x="560.0" y="405.0" class="note" text-anchor="middle">(powered from the ADC reference)</text>
</svg>
