<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title">
  <title id="title">Free-body diagram of a ball of mass m in flight, with x horizontal and z up. The velocity v is along the trajectory; the drag F_D = ½ ρ C_D A v² acts opposite to v, and the weight W = m g acts straight down. No other force acts.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="axis" x1="60.0" y1="300.0" x2="660.0" y2="300.0" marker-end="url(#ah-blue)"/>
  <text x="660.0" y="322.0" class="sym t-blue" text-anchor="end">x</text>
  <line class="axis" x1="60.0" y1="300.0" x2="60.0" y2="30.0" marker-end="url(#ah-blue)"/>
  <text x="50.0" y="42.0" class="sym t-blue" text-anchor="end">z</text>
  <path class="thin dash" d="M60.0,300.0 L65.2,291.8 L70.4,283.7 L75.6,275.8 L80.8,268.1 L86.0,260.5 L91.2,253.1 L96.4,245.8 L101.6,238.8 L106.8,231.9 L112.0,225.1 L117.2,218.5 L122.4,212.1 L127.6,205.9 L132.8,199.8 L138.0,193.9 L143.2,188.2 L148.4,182.6 L153.6,177.2 L158.8,172.0 L164.0,166.9 L169.2,162.0 L174.4,157.2 L179.6,152.7 L184.8,148.2 L190.0,144.0 L195.2,139.9 L200.4,136.0 L205.6,132.3 L210.8,128.7 L216.0,125.3 L221.2,122.0 L226.4,119.0 L231.6,116.0 L236.8,113.3 L242.0,110.7 L247.2,108.3 L252.4,106.1 L257.6,104.0 L262.8,102.1 L268.0,100.3 L273.2,98.7 L278.4,97.3 L283.6,96.1 L288.8,95.0 L294.0,94.1 L299.2,93.3 L304.4,92.7 L309.6,92.3 L314.8,92.1 L320.0,92.0 L325.2,92.1 L330.4,92.3 L335.6,92.7 L340.8,93.3 L346.0,94.1 L351.2,95.0 L356.4,96.1 L361.6,97.3 L366.8,98.7 L372.0,100.3 L377.2,102.1 L382.4,104.0 L387.6,106.1 L392.8,108.3 L398.0,110.7 L403.2,113.3 L408.4,116.0 L413.6,119.0 L418.8,122.0 L424.0,125.3 L429.2,128.7 L434.4,132.3 L439.6,136.0 L444.8,139.9 L450.0,144.0 L455.2,148.2 L460.4,152.7 L465.6,157.2 L470.8,162.0 L476.0,166.9 L481.2,172.0 L486.4,177.2 L491.6,182.6 L496.8,188.2 L502.0,193.9 L507.2,199.8 L512.4,205.9 L517.6,212.1 L522.8,218.5 L528.0,225.1 L533.2,231.9 L538.4,238.8 L543.6,245.8 L548.8,253.1 L554.0,260.5 L559.2,268.1 L564.4,275.8 L569.6,283.7 L574.8,291.8 L580.0,300.0"/>
  <line class="line" x1="452.9" y1="145.8" x2="516.4" y2="192.7" marker-end="url(#ah-ink)"/>
  <text x="524.4" y="206.7" class="sym">v</text>
  <line class="force" x1="427.1" y1="126.8" x2="367.6" y2="82.8" marker-end="url(#ah-orange)"/>
  <text x="359.6" y="46.8" class="sym t-orange" text-anchor="end">F<tspan dy="5" style="font-size:13px">D</tspan><tspan dy="-5"> = ½ ρ </tspan>C<tspan dy="5" style="font-size:13px">D</tspan><tspan dy="-5"> A v²</tspan></text>
  <text x="359.6" y="64.8" class="note" text-anchor="end">drag, opposite to v</text>
  <line class="force" x1="440.0" y1="152.3" x2="440.0" y2="231.3" marker-end="url(#ah-orange)"/>
  <text x="450.0" y="228.3" class="sym t-orange">W = m g</text>
  <circle class="body" cx="440.0" cy="136.3" r="14"/>
  <text x="460.0" y="118.3">ball, mass m</text>
</svg>
