<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="title">
  <title id="title">A bar modelled as n springs in series: a clamp at the left, springs k1, k2, k3 up to kn joining nodes with displacements u1, u2, u3 up to un, and a load fn applied at the last node.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="40" y="40" width="20" height="100"/>
  <line class="line" x1="60" y1="40" x2="60" y2="140"/>
  <text x="50" y="164" class="note" text-anchor="middle">clamp</text>
  <text x="50" y="182" class="note" text-anchor="middle"><tspan class="sym">u</tspan><tspan dy="4" font-size="12.5px" font-style="normal">0</tspan><tspan dy="-4"> = 0</tspan></text>
  <path class="line" d="M60,90 L72,90 L76.9,81 L86.6,99 L96.4,81 L106.1,99 L115.9,81 L125.6,99 L135.4,81 L145.1,99 L150,90 L162,90" style="stroke-width:1.75"/>
  <text x="111" y="70" text-anchor="middle"><tspan class="sym">k</tspan><tspan dy="4" font-size="12.5px" font-style="normal">1</tspan><tspan dy="-4">​</tspan></text>
  <path class="line" d="M178,90 L190,90 L194.4,81 L203.1,99 L211.9,81 L220.6,99 L229.4,81 L238.1,99 L246.9,81 L255.6,99 L260,90 L272,90" style="stroke-width:1.75"/>
  <text x="225" y="70" text-anchor="middle"><tspan class="sym">k</tspan><tspan dy="4" font-size="12.5px" font-style="normal">2</tspan><tspan dy="-4">​</tspan></text>
  <path class="line" d="M288,90 L300,90 L304.4,81 L313.1,99 L321.9,81 L330.6,99 L339.4,81 L348.1,99 L356.9,81 L365.6,99 L370,90 L382,90" style="stroke-width:1.75"/>
  <text x="335" y="70" text-anchor="middle"><tspan class="sym">k</tspan><tspan dy="4" font-size="12.5px" font-style="normal">3</tspan><tspan dy="-4">​</tspan></text>
  <text x="438" y="95" class="head" text-anchor="middle">…</text>
  <line class="line" x1="398" y1="90" x2="418" y2="90"/>
  <line class="line" x1="458" y1="90" x2="476" y2="90"/>
  <path class="line" d="M476,90 L488,90 L493.1,81 L503.4,99 L513.6,81 L523.9,99 L534.1,81 L544.4,99 L554.6,81 L564.9,99 L570,90 L582,90" style="stroke-width:1.75"/>
  <text x="529" y="70" text-anchor="middle"><tspan class="sym">k</tspan><tspan dy="4" font-size="12.5px" font-style="normal">n</tspan><tspan dy="-4">​</tspan></text>
  <circle class="body" cx="170" cy="90" r="8"/>
  <text x="170" y="124" text-anchor="middle"><tspan class="sym">u</tspan><tspan dy="4" font-size="12.5px" font-style="normal">1</tspan><tspan dy="-4">​</tspan></text>
  <circle class="body" cx="280" cy="90" r="8"/>
  <text x="280" y="124" text-anchor="middle"><tspan class="sym">u</tspan><tspan dy="4" font-size="12.5px" font-style="normal">2</tspan><tspan dy="-4">​</tspan></text>
  <circle class="body" cx="390" cy="90" r="8"/>
  <text x="390" y="124" text-anchor="middle"><tspan class="sym">u</tspan><tspan dy="4" font-size="12.5px" font-style="normal">3</tspan><tspan dy="-4">​</tspan></text>
  <circle class="body" cx="590" cy="90" r="8"/>
  <text x="590" y="124" text-anchor="middle"><tspan class="sym">u</tspan><tspan dy="4" font-size="12.5px" font-style="normal">n</tspan><tspan dy="-4">​</tspan></text>
  <line class="force" x1="600" y1="90" x2="680" y2="90" marker-end="url(#ah-orange)"/>
  <text x="682" y="76" class="t-orange" text-anchor="end"><tspan class="sym">f</tspan><tspan dy="4" font-size="12.5px" font-style="normal">n</tspan><tspan dy="-4">​</tspan></text>
  <text x="360" y="172" class="note" text-anchor="middle">node <tspan class="sym">i</tspan> sits between springs <tspan class="sym">k</tspan><tspan dy="4" font-size="12.5px" font-style="normal">i</tspan><tspan dy="-4">​</tspan> and <tspan class="sym">k</tspan><tspan dy="4" font-size="12.5px" font-style="normal">i+1</tspan><tspan dy="-4">;</tspan> <tspan class="sym">k</tspan><tspan dy="4" font-size="12.5px" font-style="normal">i</tspan><tspan dy="-4"> = </tspan><tspan class="sym">EA</tspan><tspan dy="4" font-size="12.5px" font-style="normal">i</tspan><tspan dy="-4">​</tspan>/<tspan class="sym">L</tspan><tspan dy="4" font-size="12.5px" font-style="normal">i</tspan><tspan dy="-4">​</tspan></text>
</svg>
