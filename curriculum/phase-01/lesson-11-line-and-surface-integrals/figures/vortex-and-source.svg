  <circle class="dot" cx="540" cy="160" r="4"/>
  <text x="180" y="30" class="head" text-anchor="middle">vortex (<tspan class="sym">Γ</tspan> &gt; 0)</text>
  <text x="540" y="30" class="head" text-anchor="middle">source (<tspan class="sym">q</tspan> &gt; 0)</text>
  <text x="180" y="296" text-anchor="middle"><tspan class="sym">v</tspan><tspan dy="4" font-size="12.5px" font-style="normal">θ</tspan><tspan dy="-4"> = </tspan><tspan class="sym">Γ</tspan>/(2π<tspan class="sym">r</tspan>)</text>
  <text x="540" y="296" text-anchor="middle"><tspan class="sym">v</tspan><tspan dy="4" font-size="12.5px" font-style="normal">r</tspan><tspan dy="-4"> = </tspan><tspan class="sym">q</tspan>/(2π<tspan class="sym">r</tspan>)</text>
  <text x="180" y="318" class="note" text-anchor="middle">arrows circulate counter-clockwise</text>
  <text x="540" y="318" class="note" text-anchor="middle">arrows point away from the centre</text>
  <text x="360" y="344" class="note" text-anchor="middle">arrow length ∝ 1/<tspan class="sym">r</tspan>: the speed halves when the distance doubles</text>
</svg>
