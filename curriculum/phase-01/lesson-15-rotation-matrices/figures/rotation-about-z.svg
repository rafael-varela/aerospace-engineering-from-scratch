<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="title">
  <title id="title">Frame a with axes x_a and y_a, and frame b obtained by turning it through angle ψ about the shared z axis, which points out of the page; x_b is ψ counter-clockwise from x_a and y_b is ψ counter-clockwise from y_a.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="axis" x1="170" y1="260" x2="400" y2="260" marker-end="url(#ah-blue)"/>
  <text x="406" y="266" class="t-blue"><tspan class="sym">x</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4">​</tspan></text>
  <line class="axis" x1="170" y1="260" x2="170" y2="30" marker-end="url(#ah-blue)"/>
  <text x="162" y="38" class="t-blue" text-anchor="end"><tspan class="sym">y</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4">​</tspan></text>
  <line class="force" x1="170" y1="260" x2="369.2" y2="145" marker-end="url(#ah-orange)"/>
  <text x="375.2" y="147" class="t-orange"><tspan class="sym">x</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4">​</tspan></text>
  <line class="force" x1="170" y1="260" x2="55" y2="60.8" marker-end="url(#ah-orange)"/>
  <text x="47" y="64.8" class="t-orange" text-anchor="end"><tspan class="sym">y</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4">​</tspan></text>
  <path class="thin" d="M290,260 A120,120 0 0 0 273.9,200.0" marker-end="url(#ah-ink2)"/>
  <text x="293.9" y="234.9" class="sym">ψ</text>
  <path class="thin" d="M170,140 A120,120 0 0 0 110.0,156.1" marker-end="url(#ah-ink2)"/>
  <text x="132.9" y="136.1" class="sym" text-anchor="end">ψ</text>
  <circle class="line" cx="170" cy="260" r="9"/>
  <circle class="dot" cx="170" cy="260" r="3"/>
  <text x="156" y="284" text-anchor="end"><tspan class="sym">z</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4"> = </tspan><tspan class="sym">z</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4">​</tspan></text>
  <text x="156" y="302" class="note" text-anchor="end">out of the page</text>
  <text x="470" y="120"><tspan class="sym">x</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4"> · </tspan><tspan class="sym">x</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4"> = cos ψ</tspan></text>
  <text x="470" y="146"><tspan class="sym">x</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4"> · </tspan><tspan class="sym">y</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4"> = sin ψ</tspan></text>
  <text x="470" y="172"><tspan class="sym">y</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4"> · </tspan><tspan class="sym">x</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4"> = −sin ψ</tspan></text>
  <text x="470" y="198"><tspan class="sym">y</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4"> · </tspan><tspan class="sym">y</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4"> = cos ψ</tspan></text>
  <text x="470" y="224"><tspan class="sym">z</tspan><tspan dy="4" font-size="12.5px" font-style="normal">b</tspan><tspan dy="-4"> = </tspan><tspan class="sym">z</tspan><tspan dy="4" font-size="12.5px" font-style="normal">a</tspan><tspan dy="-4">​</tspan></text>
  <text x="470" y="260" class="note">frame b is frame a turned by ψ</text>
  <text x="470" y="278" class="note">about z, right-hand rule</text>
</svg>
