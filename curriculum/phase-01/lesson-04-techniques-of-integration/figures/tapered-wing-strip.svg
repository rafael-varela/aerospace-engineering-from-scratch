<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img" aria-labelledby="title">
  <title id="title">Planform of a linearly tapered wing, symmetric about the roll axis at y = 0, with root chord c_r and tip chord c_t at y = s. A thin spanwise strip of width dy at distance y from the roll axis has chord c(y) and mass dm = σ c dy.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M74,104.3 L360,96 L646,104.3 L646,154.2 L360,179.2 L74,154.2 Z"/>
  <path class="body-2" d="M536.8,101.1 L560.2,101.8 L560.2,161.7 L536.8,163.8 Z" style="stroke:var(--orange);fill:var(--orange);fill-opacity:0.25"/>
  <text x="548.5" y="73.1" class="t-orange" text-anchor="middle">strip d<tspan class="sym">m</tspan> = <tspan class="sym">σ c</tspan> d<tspan class="sym">y</tspan></text>
  <line class="thin" x1="548.5" y1="79.1" x2="548.5" y2="132.5"/>
  <line class="axis dash" x1="360" y1="36" x2="360" y2="219.2"/>
  <text x="352" y="50" class="t-blue" text-anchor="end">roll axis</text>
  <text x="352" y="68" class="t-blue" text-anchor="end"><tspan class="sym">y</tspan> = 0</text>
  <line class="thin" x1="374" y1="98" x2="374" y2="177.2" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="382" y="143.6"><tspan class="sym">c</tspan><tspan dy="4" font-size="12.5px" font-style="normal">r</tspan><tspan dy="-4">​</tspan></text>
  <line class="thin" x1="662" y1="106.3" x2="662" y2="152.2" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="670" y="135.3"><tspan class="sym">c</tspan><tspan dy="4" font-size="12.5px" font-style="normal">t</tspan><tspan dy="-4">​</tspan></text>
  <line class="thin dash" x1="646" y1="96.3" x2="646" y2="36"/>
  <text x="646" y="30" text-anchor="middle">tip, <tspan class="sym">y</tspan> = <tspan class="sym">s</tspan></text>
  <line class="thin" x1="464" y1="101" x2="464" y2="168.1" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="472" y="140.6"><tspan class="sym">c</tspan>(<tspan class="sym">y</tspan>)</text>
  <line class="axis" x1="360" y1="213.2" x2="548.5" y2="213.2" marker-end="url(#ah-blue)"/>
  <text x="448.4" y="233.2" class="t-blue" text-anchor="middle">distance <tspan class="sym">y</tspan></text>
  <line class="thin" x1="536.8" y1="167.8" x2="536.8" y2="221.2"/>
  <line class="thin" x1="560.2" y1="165.7" x2="560.2" y2="221.2"/>
  <text x="568.2" y="218.2">d<tspan class="sym">y</tspan></text>
  <text x="40" y="270">mass per unit span <tspan class="sym">λ</tspan>(<tspan class="sym">y</tspan>) = <tspan class="sym">σ c</tspan>(<tspan class="sym">y</tspan>)</text>
  <text x="40" y="296"><tspan class="sym">I</tspan><tspan dy="4" font-size="12.5px" font-style="normal">xx</tspan><tspan dy="-4"> = 2 ∫</tspan><tspan dy="4" font-size="12.5px" font-style="normal">0</tspan><tspan dy="-4">​</tspan><tspan dy="-7" font-size="12.5px">s</tspan><tspan dy="7">​</tspan> <tspan class="sym">y</tspan>² <tspan class="sym">σ c</tspan>(<tspan class="sym">y</tspan>) d<tspan class="sym">y</tspan>  (both wings)</text>
  <text x="680" y="270" class="note" text-anchor="end"><tspan class="sym">c</tspan><tspan dy="4" font-size="12.5px" font-style="normal">r</tspan><tspan dy="-4">​</tspan> = 1.6 m, <tspan class="sym">c</tspan><tspan dy="4" font-size="12.5px" font-style="normal">t</tspan><tspan dy="-4">​</tspan> = 0.96 m</text>
  <text x="680" y="293" class="note" text-anchor="end"><tspan class="sym">s</tspan> = 5.5 m, <tspan class="sym">σ</tspan> = 12 kg/m²</text>
</svg>
