<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title">
  <title id="title">Point-mass model of a small satellite in body axes, x along the antenna, y along the solar-array axis and z completing the triad: four 22 kg masses at alternate corners of the bus box (±0.30, ±0.20, ±0.15) m, two 7 kg arrays at (0, ±1.60, 0.10) m, a 4 kg antenna tip at (0.90, 0.25, −0.55) m and a 16 kg tank at (−0.20, 0.10, 0.28) m.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="axis" x1="225" y1="165" x2="147.8" y2="221.2" marker-end="url(#ah-blue)"/>
  <text x="141.8" y="239.2" class="t-blue" text-anchor="end"><tspan class="sym">x</tspan> (body)</text>
  <line class="axis" x1="225" y1="165" x2="433.9" y2="186.3" marker-end="url(#ah-blue)"/>
  <text x="433.9" y="212.3" class="t-blue" text-anchor="end"><tspan class="sym">y</tspan> (body)</text>
  <line class="axis" x1="225" y1="165" x2="225" y2="61" marker-end="url(#ah-blue)"/>
  <text x="235" y="67" class="t-blue"><tspan class="sym">z</tspan> (body)</text>
  <line class="thin" x1="221.8" y1="166" x2="221.8" y2="134.8"/>
  <line class="thin" x1="221.8" y1="166" x2="262.5" y2="170.2"/>
  <line class="thin" x1="221.8" y1="166" x2="187.5" y2="191"/>
  <line class="thin" x1="221.8" y1="134.8" x2="262.5" y2="139"/>
  <line class="thin" x1="221.8" y1="134.8" x2="187.5" y2="159.8"/>
  <line class="thin" x1="262.5" y1="170.2" x2="262.5" y2="139"/>
  <line class="thin" x1="262.5" y1="170.2" x2="228.2" y2="195.2"/>
  <line class="thin" x1="262.5" y1="139" x2="228.2" y2="164"/>
  <line class="thin" x1="187.5" y1="191" x2="187.5" y2="159.8"/>
  <line class="thin" x1="187.5" y1="191" x2="228.2" y2="195.2"/>
  <line class="thin" x1="187.5" y1="159.8" x2="228.2" y2="164"/>
  <line class="thin" x1="228.2" y1="195.2" x2="228.2" y2="164"/>
  <circle class="dot" cx="221.8" cy="134.8" r="5.5"/>
  <circle class="dot" cx="262.5" cy="170.2" r="5.5"/>
  <circle class="dot" cx="187.5" cy="191" r="5.5"/>
  <circle class="dot" cx="228.2" cy="164" r="5.5"/>
  <line class="thin" x1="204.6" y1="152.5" x2="61.9" y2="138"/>
  <path class="body-2" d="M40.6,123.9 L12,144.7 L83.3,152 L111.9,131.2 Z"/>
  <circle class="dot" cx="61.9" cy="138" r="5"/>
  <line class="thin" x1="245.4" y1="156.7" x2="388.1" y2="171.2"/>
  <path class="body-2" d="M366.7,157.2 L338.1,178 L409.4,185.3 L438,164.5 Z"/>
  <circle class="dot" cx="388.1" cy="171.2" r="5"/>
  <line class="thin" x1="218" y1="194.1" x2="199" y2="262.2"/>
  <circle class="dot-o" cx="199" cy="262.2" r="4.5"/>
  <line class="thin" x1="246.6" y1="142.1" x2="246.6" y2="128.6"/>
  <circle class="dot-o" cx="246.6" cy="128.6" r="8"/>
  <text x="209" y="268.2">antenna tip</text>
  <text x="258.6" y="122.6">tank</text>
  <text x="61.9" y="102" text-anchor="middle">array</text>
  <text x="388.1" y="135.2" text-anchor="middle">array</text>
  <text x="263" y="235">bus</text>
  <text x="500" y="44" class="head">point masses, body axes</text>
  <text x="500" y="70">bus corners</text>
  <text x="700" y="70" text-anchor="end">4 × 22 kg</text>
  <text x="500" y="88" class="note">(±0.30, ±0.20, ±0.15) m, alternate</text>
  <text x="500" y="116">arrays</text>
  <text x="700" y="116" text-anchor="end">2 × 7 kg</text>
  <text x="500" y="134" class="note">(0, ±1.60, 0.10) m</text>
  <text x="500" y="162">antenna tip</text>
  <text x="700" y="162" text-anchor="end">4 kg</text>
  <text x="500" y="180" class="note">(0.90, 0.25, −0.55) m</text>
  <text x="500" y="208">tank</text>
  <text x="700" y="208" text-anchor="end">16 kg</text>
  <text x="500" y="226" class="note">(−0.20, 0.10, 0.28) m</text>
  <text x="500" y="258" class="note">x points along the antenna,</text>
  <text x="500" y="276" class="note">y along the solar-array axis</text>
</svg>
