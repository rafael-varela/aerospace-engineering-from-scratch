  <path class="flow" style="stroke-width:6;stroke-linecap:butt" d="M500,210 L500,280 Q500,300 520,300 L570,300 Q590,300 590,280 L590,150"/>
  <text x="602.0" y="84.0">open leg</text>
  <text x="602.0" y="100.0" class="note">(room pressure)</text>
