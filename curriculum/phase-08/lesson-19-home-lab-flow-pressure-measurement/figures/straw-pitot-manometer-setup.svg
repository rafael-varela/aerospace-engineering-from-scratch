  <line class="thin" x1="537.0" y1="210.0" x2="545.0" y2="210.0"/>
  <line class="thin" x1="537.0" y1="220.0" x2="549.0" y2="220.0"/>
  <line class="thin" x1="537.0" y1="230.0" x2="545.0" y2="230.0"/>
  <line class="thin" x1="537.0" y1="240.0" x2="545.0" y2="240.0"/>
  <line class="thin" x1="537.0" y1="250.0" x2="545.0" y2="250.0"/>
  <line class="thin" x1="537.0" y1="260.0" x2="545.0" y2="260.0"/>
  <line class="thin" x1="537.0" y1="270.0" x2="549.0" y2="270.0"/>
  <text x="545.0" y="62.0" class="note" text-anchor="middle">ruler</text>
  <line class="thin dash" x1="598.0" y1="210.0" x2="632.0" y2="210.0"/>
  <line class="thin dash" x1="598.0" y1="150.0" x2="632.0" y2="150.0"/>
  <line class="thin" x1="624.0" y1="208.0" x2="624.0" y2="152.0" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="632.0" y="186.0" class="sym">Δh</text>
  <text x="486.0" y="282.0" class="t-blue" text-anchor="end">water</text>
  <rect class="body-2" x="420.0" y="306.0" width="290.0" height="24.0"/>
  <text x="565.0" y="364.0" class="note" text-anchor="middle">towel under the board</text>
  <text x="20.0" y="364.0" class="note">separate dry table</text>
