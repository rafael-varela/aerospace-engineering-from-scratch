  <line class="thin" x1="199.0" y1="140.5" x2="206.0" y2="140.5"/>
  <line class="thin" x1="199.0" y1="130.0" x2="206.0" y2="130.0"/>
  <line class="thin" x1="199.0" y1="119.5" x2="206.0" y2="119.5"/>
  <line class="thin" x1="199.0" y1="109.0" x2="206.0" y2="109.0"/>
  <line class="thin" x1="194.0" y1="98.5" x2="206.0" y2="98.5"/>
  <text x="178.0" y="313.5" class="note" text-anchor="end">0</text>
  <text x="178.0" y="282.0" class="note" text-anchor="end">30</text>
  <text x="178.0" y="208.5" class="note" text-anchor="end">100</text>
  <text x="178.0" y="103.5" class="note" text-anchor="end">200</text>
  <line class="thin dash" x1="206.0" y1="308.5" x2="320.5" y2="308.5"/>
  <line class="thin dash" x1="206.0" y1="98.5" x2="230.0" y2="98.5"/>
  <text x="20.0" y="30.0">ruler, zero at hole centre,</text>
  <text x="20.0" y="48.0" class="note">marks every 10 mm</text>
</svg>
