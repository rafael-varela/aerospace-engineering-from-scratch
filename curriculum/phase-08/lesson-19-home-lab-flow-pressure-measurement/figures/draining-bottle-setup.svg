  <rect class="body-2" x="150.0" y="364.0" width="410.0" height="16.0"/>
  <rect class="body-2" x="230.0" y="98.5" width="94.5" height="241.5"/>
  <path class="line" d="M230,56.5 L230,340 L324.5,340 L324.5,56.5"/>
  <line class="flow" x1="230.0" y1="98.5" x2="324.5" y2="98.5"/>
  <path class="flow" d="M238,104.5 q6,-4 12,0 t12,0 t12,0"/>
  <text x="336.5" y="103.5" class="t-blue">water surface</text>
  <text x="336.5" y="121.5" class="note">filled to 200 mm</text>
  <circle class="body" cx="324.5" cy="308.5" r="3"/>
  <path class="flow" d="M328.5,308.5 L331.7,308.5 L334.9,308.7 L338.1,308.9 L341.3,309.3 L344.5,309.7 L347.7,310.3 L350.9,310.9 L354.1,311.6 L357.3,312.5 L360.5,313.4 L363.7,314.4 L366.9,315.6 L370.1,316.8 L373.3,318.1 L376.5,319.6 L379.7,321.1 L382.9,322.7 L386.1,324.4 L389.3,326.2 L392.5,328.2 L395.7,330.2 L398.9,332.3 L402.1,334.5 L405.3,336.8 L408.5,339.2 L411.7,341.7 L414.9,344.3 L418.1,347.0 L421.3,349.8 L424.5,352.7 L427.7,355.7 L430.9,358.8 L434.1,362.0" marker-end="url(#ah-blue)"/>
  <text x="338.5" y="278.5" class="t-blue">jet (4 mm hole,</text>
  <text x="338.5" y="296.5" class="t-blue">tape pulled at t = 0)</text>
  <text x="470.0" y="358.0" class="note">into the basin</text>
  <line class="thin" x1="232.0" y1="75.4" x2="322.5" y2="75.4" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="277.2" y="67.4" class="note" text-anchor="middle">90 mm</text>
  <rect class="body" x="184.0" y="85.9" width="22.0" height="228.9"/>
  <line class="thin" x1="194.0" y1="308.5" x2="206.0" y2="308.5"/>
  <line class="thin" x1="199.0" y1="298.0" x2="206.0" y2="298.0"/>
  <line class="thin" x1="199.0" y1="287.5" x2="206.0" y2="287.5"/>
  <line class="thin" x1="199.0" y1="277.0" x2="206.0" y2="277.0"/>
  <line class="thin" x1="199.0" y1="266.5" x2="206.0" y2="266.5"/>
  <line class="thin" x1="194.0" y1="256.0" x2="206.0" y2="256.0"/>
  <line class="thin" x1="199.0" y1="245.5" x2="206.0" y2="245.5"/>
