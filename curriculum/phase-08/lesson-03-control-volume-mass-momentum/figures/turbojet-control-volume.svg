<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="title">
  <title id="title">A control-volume box of cross-section A_box around a turbojet in the engine frame. Air at V₀ and p_a enters through the inlet face (n_x = −1); the side face (n_x = 0) carries ṁ_side with u_x = V₀; the exit plane at the nozzle exit carries the jet (V_e, p_e, ρ_e, area A_e) and ambient flow over area A_box − A_e. The cut pylon carries force F and the fuel line brings in f ṁ_a with no x-velocity.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M190.0,151.0 L230.0,143.0 L470.0,143.0 L540.0,165.0 L540.0,225.0 L470.0,247.0 L230.0,247.0 L190.0,239.0 Z"/>
  <text x="222.0" y="200.0" class="note" text-anchor="middle">intake</text>
  <text x="302.0" y="200.0" class="note" text-anchor="middle">compressor</text>
  <text x="392.0" y="200.0" class="note" text-anchor="middle">burner</text>
  <text x="476.0" y="200.0" class="note" text-anchor="middle">nozzle</text>
  <text x="260.0" y="133.0" class="head" text-anchor="middle">engine</text>
  <rect class="body" x="420.0" y="58.0" width="20.0" height="85.0"/>
  <path class="line" d="M412,58 l8,-6 l8,6 l8,-6 l8,6 l8,-6"/>
  <line class="force" x1="452.0" y1="50.0" x2="492.0" y2="50.0" marker-end="url(#ah-orange)"/>
  <text x="498.0" y="55.0" class="sym t-orange">F</text>
  <text x="452.0" y="32.0" class="note">pylon (cut): force F</text>
  <line class="flow" x1="392.0" y1="344.0" x2="392.0" y2="249.0" marker-end="url(#ah-blue)"/>
  <text x="382.0" y="360.0" class="note" text-anchor="end">fuel line: n<tspan dy="4" font-size="0.75em">x</tspan><tspan dy="-4">​</tspan> = 0, fṁ<tspan dy="4" font-size="0.75em">a</tspan><tspan dy="-4">​</tspan> in with u<tspan dy="4" font-size="0.75em">x</tspan><tspan dy="-4">​</tspan> = 0</text>
  <rect class="thin dash" x="90.0" y="80.0" width="450.0" height="230.0"/>
  <line class="flow" x1="30.0" y1="100.0" x2="86.0" y2="100.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="30.0" y1="140.0" x2="86.0" y2="140.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="30.0" y1="195.0" x2="86.0" y2="195.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="30.0" y1="250.0" x2="86.0" y2="250.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="30.0" y1="290.0" x2="86.0" y2="290.0" marker-end="url(#ah-blue)"/>
  <text x="26.0" y="165.0" class="sym t-blue">V₀, p<tspan dy="4" font-size="0.75em">a</tspan><tspan dy="-4">​</tspan></text>
  <text x="20.0" y="334.0" class="note">inlet face: n<tspan dy="4" font-size="0.75em">x</tspan><tspan dy="-4">​</tspan> = −1, A<tspan dy="4" font-size="0.75em">box</tspan><tspan dy="-4">​</tspan></text>
  <text x="90.0" y="70.0" class="note">side face: n<tspan dy="4" font-size="0.75em">x</tspan><tspan dy="-4">​</tspan> = 0, carries ṁ<tspan dy="4" font-size="0.75em">side</tspan><tspan dy="-4">​</tspan> with u<tspan dy="4" font-size="0.75em">x</tspan><tspan dy="-4">​</tspan> = V₀</text>
  <line class="flow" x1="544.0" y1="100.0" x2="584.0" y2="100.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="544.0" y1="140.0" x2="584.0" y2="140.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="544.0" y1="250.0" x2="584.0" y2="250.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="544.0" y1="290.0" x2="584.0" y2="290.0" marker-end="url(#ah-blue)"/>
  <rect class="body-2" x="540.0" y="169.0" width="64.0" height="52.0"/>
  <line class="flow" x1="544.0" y1="195.0" x2="620.0" y2="195.0" marker-end="url(#ah-blue)"/>
  <text x="628.0" y="182.0" class="t-blue">jet:</text>
  <text x="628.0" y="200.0" class="t-blue">V<tspan dy="4" font-size="0.75em">e</tspan><tspan dy="-4">​</tspan>, p<tspan dy="4" font-size="0.75em">e</tspan><tspan dy="-4">​</tspan>, ρ<tspan dy="4" font-size="0.75em">e</tspan><tspan dy="-4">​</tspan></text>
  <text x="628.0" y="218.0" class="note">area A<tspan dy="4" font-size="0.75em">e</tspan><tspan dy="-4">​</tspan></text>
  <text x="592.0" y="105.0" class="t-blue">ambient, V₀, p<tspan dy="4" font-size="0.75em">a</tspan><tspan dy="-4">​</tspan></text>
  <text x="592.0" y="123.0" class="note">area A<tspan dy="4" font-size="0.75em">box</tspan><tspan dy="-4">​</tspan> − A<tspan dy="4" font-size="0.75em">e</tspan><tspan dy="-4">​</tspan></text>
  <line class="axis" x1="20.0" y1="30.0" x2="70.0" y2="30.0" marker-end="url(#ah-blue)"/>
  <text x="76.0" y="35.0" class="sym t-blue">x</text>
  <text x="550.0" y="334.0" class="note" text-anchor="middle">exit plane at the nozzle exit</text>
</svg>
