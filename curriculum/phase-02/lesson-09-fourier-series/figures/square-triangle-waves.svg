<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title">
  <title id="title">Two waveforms of amplitude A over two periods T. Left: the odd square wave, +A on (0, T/2) and −A on (T/2, T), whose sine coefficients are b_n = 4A/(πn) for odd n. Right: the even triangle wave, +A at t = 0 and −A at t = T/2 with straight lines between, whose cosine coefficients are a_n = 8A/(π²n²) for odd n.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="axis" x1="30.0" y1="130.0" x2="310.0" y2="130.0" marker-end="url(#ah-blue)"/>
  <text x="310.0" y="150.0" class="sym t-blue" text-anchor="end">t</text>
  <line class="axis" x1="40.0" y1="207.0" x2="40.0" y2="51.0" marker-end="url(#ah-blue)"/>
  <text x="32.0" y="80.0" text-anchor="end">+A</text>
  <text x="32.0" y="190.0" text-anchor="end">−A</text>
  <line class="thin" x1="36.0" y1="75.0" x2="44.0" y2="75.0"/>
  <line class="thin" x1="36.0" y1="185.0" x2="44.0" y2="185.0"/>
  <line class="thin" x1="100.0" y1="126.0" x2="100.0" y2="134.0"/>
  <text x="100.0" y="209.0" class="note" text-anchor="middle">T/2</text>
  <line class="thin" x1="160.0" y1="126.0" x2="160.0" y2="134.0"/>
  <text x="160.0" y="209.0" class="note" text-anchor="middle">T</text>
  <line class="thin" x1="220.0" y1="126.0" x2="220.0" y2="134.0"/>
  <text x="220.0" y="209.0" class="note" text-anchor="middle">3T/2</text>
  <line class="thin" x1="280.0" y1="126.0" x2="280.0" y2="134.0"/>
  <text x="280.0" y="209.0" class="note" text-anchor="middle">2T</text>
  <line class="force" x1="40.0" y1="75.0" x2="100.0" y2="75.0"/>
  <line class="force" x1="100.0" y1="185.0" x2="160.0" y2="185.0"/>
  <line class="thin dash" x1="100.0" y1="75.0" x2="100.0" y2="185.0"/>
  <line class="force" x1="160.0" y1="75.0" x2="220.0" y2="75.0"/>
  <line class="thin dash" x1="160.0" y1="75.0" x2="160.0" y2="185.0"/>
  <line class="force" x1="220.0" y1="185.0" x2="280.0" y2="185.0"/>
  <line class="thin dash" x1="220.0" y1="75.0" x2="220.0" y2="185.0"/>
  <line class="thin dash" x1="40.0" y1="75.0" x2="40.0" y2="130.0"/>
  <text x="108.0" y="118.0" class="note">jump</text>
  <text x="20.0" y="30.0" class="head">Square wave (odd): a jump</text>
  <text x="20.0" y="243.0" class="sym">b</text>
  <text x="29.0" y="247.0" class="note">n</text>
  <text x="42.0" y="243.0" class="sym">= 4A/(πn),  odd n</text>
  <line class="axis" x1="390.0" y1="130.0" x2="670.0" y2="130.0" marker-end="url(#ah-blue)"/>
  <text x="670.0" y="150.0" class="sym t-blue" text-anchor="end">t</text>
  <line class="axis" x1="400.0" y1="207.0" x2="400.0" y2="51.0" marker-end="url(#ah-blue)"/>
  <text x="392.0" y="80.0" text-anchor="end">+A</text>
  <text x="392.0" y="190.0" text-anchor="end">−A</text>
  <line class="thin" x1="396.0" y1="75.0" x2="404.0" y2="75.0"/>
  <line class="thin" x1="396.0" y1="185.0" x2="404.0" y2="185.0"/>
  <line class="thin" x1="460.0" y1="126.0" x2="460.0" y2="134.0"/>
  <text x="460.0" y="209.0" class="note" text-anchor="middle">T/2</text>
  <line class="thin" x1="520.0" y1="126.0" x2="520.0" y2="134.0"/>
  <text x="520.0" y="209.0" class="note" text-anchor="middle">T</text>
  <line class="thin" x1="580.0" y1="126.0" x2="580.0" y2="134.0"/>
  <text x="580.0" y="209.0" class="note" text-anchor="middle">3T/2</text>
  <line class="thin" x1="640.0" y1="126.0" x2="640.0" y2="134.0"/>
  <text x="640.0" y="209.0" class="note" text-anchor="middle">2T</text>
  <path class="force" d="M400.0,75.0 L460.0,185.0 L520.0,75.0 L580.0,185.0 L640.0,75.0"/>
  <text x="472.0" y="189.0" class="note">kink</text>
  <text x="380.0" y="30.0" class="head">Triangle wave (even): a kink</text>
  <text x="380.0" y="243.0" class="sym">a</text>
  <text x="389.0" y="247.0" class="note">n</text>
  <text x="402.0" y="243.0" class="sym">= 8A/(π²n²),  odd n</text>
</svg>
