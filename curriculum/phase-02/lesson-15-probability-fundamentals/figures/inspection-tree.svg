<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title">
  <title id="title">A probability tree for eddy-current inspection. From the root, a hole is cracked with probability 0.02 or good with 0.98. A cracked hole is flagged with 0.90 and passed with 0.10; a good hole is flagged with 0.05 and passed with 0.95. The four leaves are cracked and flagged 0.0180, cracked and passed 0.0020, good and flagged 0.0490 and good and passed 0.9310.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <text x="140.0" y="24.0" class="note" text-anchor="middle">prior: hole</text>
  <text x="320.0" y="24.0" class="note" text-anchor="middle">inspection result</text>
  <text x="430.0" y="24.0" class="note">joint probability (leaf)</text>
  <line class="line" x1="50.0" y1="170.0" x2="230.0" y2="90.0"/>
  <text x="140.0" y="120.0" class="t-orange" text-anchor="middle">0.02</text>
  <circle class="dot" cx="230.0" cy="90.0" r="5"/>
  <text x="230.0" y="78.0" class="head" text-anchor="middle">cracked</text>
  <line class="line" x1="230.0" y1="90.0" x2="410.0" y2="52.0"/>
  <text x="320.0" y="61.0" class="t-orange" text-anchor="middle">flag  0.90</text>
  <circle class="dot" cx="410.0" cy="52.0" r="4"/>
  <text x="426.0" y="50.0">cracked &amp; flagged</text>
  <text x="426.0" y="68.0" class="note">0.02 × 0.90 = 0.0180</text>
  <line class="line" x1="230.0" y1="90.0" x2="410.0" y2="128.0"/>
  <text x="320.0" y="131.0" class="t-orange" text-anchor="middle">pass  0.10</text>
  <circle class="dot" cx="410.0" cy="128.0" r="4"/>
  <text x="426.0" y="126.0">cracked &amp; passed</text>
  <text x="426.0" y="144.0" class="note">0.02 × 0.10 = 0.0020</text>
  <line class="line" x1="50.0" y1="170.0" x2="230.0" y2="250.0"/>
  <text x="140.0" y="232.0" class="t-orange" text-anchor="middle">0.98</text>
  <circle class="dot" cx="230.0" cy="250.0" r="5"/>
  <text x="230.0" y="276.0" class="head" text-anchor="middle">good</text>
  <line class="line" x1="230.0" y1="250.0" x2="410.0" y2="212.0"/>
  <text x="320.0" y="221.0" class="t-orange" text-anchor="middle">flag  0.05</text>
  <circle class="dot" cx="410.0" cy="212.0" r="4"/>
  <text x="426.0" y="210.0">good &amp; flagged</text>
  <text x="426.0" y="228.0" class="note">0.98 × 0.05 = 0.0490</text>
  <line class="line" x1="230.0" y1="250.0" x2="410.0" y2="288.0"/>
  <text x="320.0" y="291.0" class="t-orange" text-anchor="middle">pass  0.95</text>
  <circle class="dot" cx="410.0" cy="288.0" r="4"/>
  <text x="426.0" y="286.0">good &amp; passed</text>
  <text x="426.0" y="304.0" class="note">0.98 × 0.95 = 0.9310</text>
  <circle class="dot" cx="50.0" cy="170.0" r="6"/>
  <text x="40.0" y="334.0" class="note">leaves sum to 1;  P(flag) = 0.0180 + 0.0490 = 0.0670</text>
</svg>
