<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title">
  <title id="title">A rigid body hanging from a knife-edge pivot, swung through angle θ from the vertical. Its centre of mass, of mass m = 4.2 kg and I_cg = 0.21 kg m², is a distance d = 0.35 m from the pivot; the weight m g acts straight down at the centre of mass with lever arm d sin θ about the pivot.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="150.0" y="22.0" width="200.0" height="26.0" rx="0"/>
  <line class="line" x1="150.0" y1="48.0" x2="350.0" y2="48.0"/>
  <path class="body" d="M240.5,68.9 L385.7,315.4 A15,15 0 0 0 411.1,299.5 L253.2,60.9 Z" style="opacity:0.9"/>
  <path class="body" d="M234.0,48.0 L266.0,48.0 L250.0,70.0 L234.0,48.0"/>
  <circle class="dot" cx="250.0" cy="70.0" r="3.5"/>
  <line class="thin dash" x1="250.0" y1="70.0" x2="250.0" y2="370.0"/>
  <line class="thin" x1="250.0" y1="70.0" x2="361.3" y2="248.1"/>
  <path class="thin" d="M250,185 A115,115 0 0 0 310.9,167.5" marker-end="url(#ah-ink2)"/>
  <text x="279.7" y="200.5" class="sym">θ</text>
  <line class="thin" x1="277.1" y1="53.0" x2="289.0" y2="45.6"/>
  <line class="thin" x1="377.4" y1="238.0" x2="400.3" y2="223.7"/>
  <line class="thin" x1="283.9" y1="48.8" x2="395.2" y2="226.9" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="350.0" y="132.5" class="sym">d = 0.35 m</text>
  <circle class="body" cx="361.3" cy="248.1" r="9"/>
  <path class="dot" d="M361.283045488973,248.09010019284946 L370.283045488973,248.09010019284946 A9,9 0 0 1 361.283045488973,257.0901001928495 Z M361.283045488973,248.09010019284946 L352.283045488973,248.09010019284946 A9,9 0 0 1 361.283045488973,239.09010019284946 Z"/>
  <line class="force" x1="361.3" y1="257.1" x2="361.3" y2="358.1" marker-end="url(#ah-orange)"/>
  <text x="371.3" y="352.1" class="sym t-orange">m g</text>
  <line class="thin" x1="250.0" y1="378.1" x2="361.3" y2="378.1" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <line class="thin dash" x1="361.3" y1="261.1" x2="361.3" y2="384.1"/>
  <text x="305.6" y="398.1" class="sym" text-anchor="middle">d sin θ</text>
  <text x="226.0" y="68.0" text-anchor="end">pivot (knife edge)</text>
  <line class="thin" x1="373.3" y1="252.1" x2="440.0" y2="264.1"/>
  <text x="446.0" y="260.1">centre of mass</text>
  <text x="446.0" y="278.1" class="note">m = 4.2 kg,  I_cg = 0.21 kg m²</text>
  <text x="446.0" y="296.1" class="note">I_pivot = I_cg + m d² = 0.7245 kg m²</text>
  <text x="431.1" y="321.5" class="note">rigid body (airframe)</text>
</svg>
