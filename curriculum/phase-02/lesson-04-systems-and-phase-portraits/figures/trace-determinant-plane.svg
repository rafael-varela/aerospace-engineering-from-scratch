  <line class="force" x1="275" y1="288" x2="275" y2="44.00000000000003"/>
  <text x="197.0" y="116.0" class="head" text-anchor="middle">stable</text>
  <text x="197.0" y="133.0" class="head" text-anchor="middle">spirals</text>
  <text x="353.0" y="116.0" class="head" text-anchor="middle">unstable</text>
  <text x="353.0" y="133.0" class="head" text-anchor="middle">spirals</text>
  <text x="71.0" y="224.0" class="head" text-anchor="middle">stable</text>
  <text x="71.0" y="241.0" class="head" text-anchor="middle">nodes</text>
  <text x="479.0" y="224.0" class="head" text-anchor="middle">unstable</text>
  <text x="479.0" y="241.0" class="head" text-anchor="middle">nodes</text>
  <text x="275.0" y="335.0" class="head" text-anchor="middle">saddles  (Δ &lt; 0)</text>
  <line class="thin" x1="493.0" y1="103.0" x2="547.0" y2="96.0"/>
  <text x="555.0" y="100.0">on the parabola τ² = 4Δ:</text>
  <text x="555.0" y="117.0" class="note">degenerate nodes, stars</text>
  <text x="285.0" y="57.0">centers on the Δ axis</text>
  <text x="285.0" y="74.0" class="note">(τ = 0, Δ &gt; 0)</text>
  <line class="thin" x1="455.0" y1="293.0" x2="547.0" y2="332.0"/>
  <text x="555.0" y="336.0">on the τ axis (Δ = 0):</text>
  <text x="555.0" y="353.0" class="note">non-isolated fixed points</text>
</svg>
