<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" width="580" height="310" role="img" aria-labelledby="title">
  <title id="title">The complex plane with real axis Re and imaginary axis Im. The phasor Z = A e^{iφ} is the arrow at t = 0; as time runs the arrow Z e^{iωt} rotates counter-clockwise at ω around a circle of radius A, at angle φ + ωt from the real axis, and its projection onto the real axis is the signal x(t) = Re(Z e^{iωt}).</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="axis" x1="30.0" y1="240.0" x2="560.0" y2="240.0" marker-end="url(#ah-blue)"/>
  <text x="560.0" y="262.0" class="t-blue" text-anchor="end">Re</text>
  <line class="axis" x1="210.0" y1="300.0" x2="210.0" y2="34.0" marker-end="url(#ah-blue)"/>
  <text x="200.0" y="46.0" class="t-blue" text-anchor="end">Im</text>
  <circle class="thin dash" cx="210.0" cy="240.0" r="150"/>
  <line class="thin" x1="210.0" y1="240.0" x2="348.1" y2="189.7" marker-end="url(#ah-ink2)"/>
  <text x="363.0" y="190.7" class="sym">Z = A e<tspan dy="-8" style="font-size:13px">iφ</tspan><tspan dy="8"> </tspan></text>
  <text x="363.0" y="208.7" class="note">the phasor, t = 0</text>
  <line class="force" x1="210.0" y1="240.0" x2="277.2" y2="108.1" marker-end="url(#ah-orange)"/>
  <text x="292.1" y="98.3" class="sym t-orange">Z e<tspan dy="-8" style="font-size:13px">iωt</tspan><tspan dy="8"> </tspan></text>
  <text x="232.0" y="171.2" class="note" text-anchor="end">A = |Z|</text>
  <path class="flow" d="M271.4,87.9 A164,164 0 0 0 195.7,76.6" marker-end="url(#ah-blue)"/>
  <text x="177.1" y="70.1" class="t-blue" text-anchor="end">rotating at ω</text>
  <path class="thin" d="M256.0,240.0 A46,46 0 0 0 253.2,224.3" marker-end="url(#ah-ink2)"/>
  <text x="267.1" y="235.9" class="sym">φ</text>
  <path class="thin" d="M306.0,240.0 A96,96 0 0 0 253.6,154.5" marker-end="url(#ah-ink2)"/>
  <text x="294.6" y="181.5" class="sym">φ + ωt</text>
  <line class="thin dash" x1="278.1" y1="110.3" x2="278.1" y2="240.0"/>
  <circle class="dot-o" cx="278.1" cy="240.0" r="5"/>
  <text x="272.1" y="270.0" class="sym" text-anchor="middle">x(t) = Re(Z e<tspan dy="-8" style="font-size:13px">iωt</tspan><tspan dy="8"> </tspan>)</text>
  <text x="278.1" y="290.0" class="note" text-anchor="middle">= A cos(ωt + φ)</text>
  <circle class="dot" cx="210.0" cy="240.0" r="3.5"/>
</svg>
