<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-labelledby="title">
  <title id="title">Side view of the drop test: a wall or door frame with height marks at 0.6, 0.9, 1.2, 1.5 and 1.8 m; a ball held from below by two fingertips with its bottom at 1.8 m; the drop height h measured from the bottom of the ball to the floor; a mat on the floor with a 1 m exclusion circle around it; and a phone on a stand 1.5 m back with its lens level with mid-fall.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="96" y="30" width="24" height="300"/>
  <line class="line" x1="120" y1="30" x2="120" y2="330"/>
  <rect class="ground" x="40" y="330" width="640" height="14"/>
  <line class="line" x1="40" y1="330" x2="680" y2="330"/>
  <line class="line" x1="120" y1="246" x2="130" y2="246"/>
  <text x="90" y="251" class="note" text-anchor="end">0.6</text>
  <line class="line" x1="120" y1="204" x2="130" y2="204"/>
  <text x="90" y="209" class="note" text-anchor="end">0.9</text>
  <line class="line" x1="120" y1="162" x2="130" y2="162"/>
  <text x="90" y="167" class="note" text-anchor="end">1.2</text>
  <line class="line" x1="120" y1="120" x2="130" y2="120"/>
  <text x="90" y="125" class="note" text-anchor="end">1.5</text>
  <line class="line" x1="120" y1="78" x2="130" y2="78"/>
  <text x="90" y="83" class="note" text-anchor="end">1.8</text>
  <text x="90" y="22" class="note" text-anchor="end">m</text>
  <line class="thin" x1="170" y1="82" x2="170" y2="318" style="stroke-dasharray:2 5"/>
  <circle class="body" cx="170" cy="67" r="11"/>
  <ellipse class="body" cx="162" cy="84.0" rx="6" ry="4.5"/>
  <ellipse class="body" cx="178" cy="84.0" rx="6" ry="4.5"/>
  <rect class="body-2" x="130" y="321" width="80" height="9"/>
  <line class="thin" x1="185" y1="78" x2="226" y2="78"/>
  <line class="thin" x1="216" y1="80" x2="216" y2="328" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="224" y="153" class="sym">h</text>
  <text x="238" y="153" class="note">= bottom of ball to floor</text>
  <line class="line" x1="520" y1="224" x2="520" y2="330"/>
  <line class="line" x1="496" y1="330" x2="544" y2="330"/>
  <line class="line" x1="506" y1="330" x2="520" y2="300"/>
  <line class="line" x1="534" y1="330" x2="520" y2="300"/>
  <rect class="body" x="512" y="178" width="16" height="46" rx="3"/>
  <circle class="dot" cx="512" cy="204" r="3"/>
  <line class="thin dash" x1="170" y1="204" x2="506" y2="204"/>
  <text x="538" y="164">phone on stand,</text>
  <text x="538" y="183" class="note">lens level with mid-fall</text>
  <line class="thin" x1="172" y1="366" x2="518" y2="366" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <line class="thin" x1="520" y1="346" x2="520" y2="374"/>
  <line class="thin" x1="170" y1="346" x2="170" y2="374"/>
  <text x="345" y="360" class="note" text-anchor="middle">1.5 m</text>
  <text x="192" y="53">ball held from below</text>
  <text x="192" y="71" class="note">by two fingertips</text>
  <text x="128" y="18" class="note">wall or door frame with height marks</text>
  <text x="170" y="394" class="note">mat, with a 1 m exclusion circle around it</text>
  <text x="680" y="322" class="note" text-anchor="end">floor</text>
</svg>
