<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="title">
  <title id="title">Flow diagram of the flight-log pipeline: CSV text goes through parse_header to names and units, and through parse rows to float64 columns with NaN for gaps; convert_to_si turns these into SI columns in m, m/s and deg; a check that time has no NaN and is strictly increasing follows; then fill_missing and resample_uniform lead to summarize, HDF5 or plot.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="body-2" x="20" y="73" width="96" height="44" rx="4"/>
  <text x="68" y="100" text-anchor="middle">CSV text</text>
  <path class="axis" d="M116,82 L150,50 L318,50" marker-end="url(#ah-blue)"/>
  <text x="230" y="41" class="t-blue" text-anchor="middle" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">parse_header</text>
  <rect class="body-2" x="322" y="31" width="150" height="38" rx="4"/>
  <text x="397" y="55" text-anchor="middle">names + units</text>
  <path class="axis" d="M116,108 L150,140 L238,140" marker-end="url(#ah-blue)"/>
  <text x="184" y="131" class="t-blue" text-anchor="middle" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">parse rows</text>
  <rect class="body-2" x="242" y="110" width="200" height="60" rx="4"/>
  <text x="342" y="135.5" text-anchor="middle">float64 columns,</text>
  <text x="342" y="154.5" text-anchor="middle">NaN for gaps</text>
  <line class="axis" x1="442" y1="140" x2="562" y2="140" marker-end="url(#ah-blue)"/>
  <text x="502" y="131" class="t-blue" text-anchor="middle" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">convert_to_si</text>
  <rect class="body-2" x="566" y="121" width="134" height="38" rx="4"/>
  <text x="633" y="145" text-anchor="middle">SI: m, m/s, deg</text>
  <line class="axis" x1="633" y1="159" x2="633" y2="224" marker-end="url(#ah-blue)"/>
  <rect class="body" x="530" y="226" width="170" height="48" rx="4" style="stroke-dasharray:6 4"/>
  <text x="615" y="246" class="note" text-anchor="middle">check: time has no NaN,</text>
  <text x="615" y="264" class="note" text-anchor="middle">strictly increasing</text>
  <line class="axis" x1="530" y1="250" x2="410" y2="250" marker-end="url(#ah-blue)"/>
  <text x="470" y="241" class="t-blue" text-anchor="middle" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">fill_missing</text>
  <circle class="dot" cx="406" cy="250" r="3.5" style="fill:var(--blue)"/>
  <line class="axis" x1="402" y1="250" x2="254" y2="250" marker-end="url(#ah-blue)"/>
  <text x="328" y="241" class="t-blue" text-anchor="middle" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">resample_uniform</text>
  <rect class="body-2" x="20" y="231" width="230" height="38" rx="4"/>
  <text x="135" y="255" text-anchor="middle">summarize / HDF5 / plot</text>
  <text x="360" y="300" class="note" text-anchor="middle">Each arrow is one function in starter/main.py.</text>
</svg>
