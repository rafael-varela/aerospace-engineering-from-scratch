<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" role="img" aria-labelledby="title">
  <title id="title">Plan view of the drop-test room: a wall with height marks along one side; the release point just in front of it, above a mat; a dashed 1 m exclusion circle around the mat that nobody enters while a ball is held; the phone on a stand 1.5 m from the impact point; the experimenter standing outside the circle; and a closed door.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <defs><clipPath id="room"><rect x="40" y="52" width="420" height="276"/></clipPath></defs>
  <rect class="body" x="40" y="52" width="420" height="276" style="fill:none"/>
  <rect class="ground" x="40" y="36" width="420" height="16"/>
  <line class="line" x1="40" y1="52" x2="460" y2="52"/>
  <line class="thin" x1="70" y1="52" x2="70" y2="62"/>
  <line class="thin" x1="115" y1="52" x2="115" y2="62"/>
  <line class="thin" x1="160" y1="52" x2="160" y2="62"/>
  <line class="thin" x1="205" y1="52" x2="205" y2="62"/>
  <line class="thin" x1="250" y1="52" x2="250" y2="62"/>
  <line class="thin" x1="295" y1="52" x2="295" y2="62"/>
  <line class="thin" x1="340" y1="52" x2="340" y2="62"/>
  <line class="thin" x1="385" y1="52" x2="385" y2="62"/>
  <line class="thin" x1="430" y1="52" x2="430" y2="62"/>
  <line class="line" x1="360" y1="328" x2="440" y2="328" style="stroke-width:5"/>
  <path class="thin dash" d="M360,328 A80,80 0 0 1 440,248"/>
  <g clip-path="url(#room)">
  <circle class="thin dash" cx="160" cy="118" r="92"/>
  </g>
  <ellipse class="body-2" cx="160" cy="118" rx="44" ry="28"/>
  <circle class="dot" cx="160" cy="118" r="5.5"/>
  <text x="154" y="166" text-anchor="middle">mat</text>
  <line class="thin" x1="153.7" y1="115" x2="79.3" y2="80.4" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="96" y="114" class="note" text-anchor="middle">1 m</text>
  <rect class="body" x="223.1" y="220" width="20" height="30" rx="3"/>
  <circle class="dot" cx="233.1" cy="229" r="3"/>
  <line class="thin" x1="164.2" y1="124.8" x2="226.8" y2="220.6" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="204.8" y="201.8" class="note" text-anchor="end">1.5 m</text>
  <line class="force" x1="71" y1="283" x2="89" y2="301"/>
  <line class="force" x1="71" y1="301" x2="89" y2="283"/>
  <text x="100" y="288">experimenter stands here,</text>
  <text x="100" y="306" class="note">outside the circle</text>
  <line class="thin" x1="482" y1="43" x2="452" y2="44"/>
  <text x="490" y="48">wall with height marks</text>
  <line class="thin" x1="482" y1="95" x2="165" y2="116"/>
  <text x="490" y="100">release point</text>
  <text x="490" y="118" class="note">the ball drops here</text>
  <line class="thin" x1="482" y1="163" x2="245.3" y2="152.5"/>
  <text x="490" y="168">1 m exclusion circle</text>
  <text x="490" y="186" class="note">nobody inside it while a ball is held</text>
  <line class="thin" x1="482" y1="239" x2="244.1" y2="235"/>
  <text x="490" y="244">phone on stand, 1.5 m away</text>
  <line class="thin" x1="482" y1="325" x2="442" y2="328"/>
  <text x="490" y="330">door closed</text>
  <text x="250" y="354" class="note" text-anchor="middle">plan view, from above</text>
</svg>
