<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-labelledby="title">
  <title id="title">Curve of thrust-to-weight ratio T/W against lift coefficient C_L for C_D0 = 0.02 and k = 0.0442. T/W rises steeply at low C_L (fast flight, parasite drag C_D0/C_L dominates) and rises again at high C_L (slow flight, induced drag k C_L dominates), with a flat minimum (T/W)min = 2√(C_D0 k) = 0.060 at C_L* = 0.67.</title>
