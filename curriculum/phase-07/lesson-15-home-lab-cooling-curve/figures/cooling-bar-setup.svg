<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-labelledby="title">
  <title id="title">Side view of the cooling-curve set-up: a pencil or ruler rests across two stacks of books; two cotton string loops hang from it and hold the aluminium bar (25.4 mm × 50 mm) horizontal. A probe tip or thermistor is taped under the bar with foil tape, and its lead runs to the thermometer or microcontroller at the dry end of the table. A room thermometer stands 1 m away at the same height.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="0.0" y="300.0" width="720.0" height="14.0"/>
  <line class="line" x1="0.0" y1="300.0" x2="720.0" y2="300.0"/>
  <rect class="body" x="24.0" y="256.0" width="64.0" height="44.0" rx="2"/>
  <rect class="body" x="28.0" y="204.0" width="64.0" height="52.0" rx="2"/>
  <rect class="body" x="21.0" y="164.0" width="64.0" height="40.0" rx="2"/>
  <rect class="body" x="26.0" y="116.0" width="64.0" height="48.0" rx="2"/>
  <rect class="body" x="22.0" y="80.0" width="64.0" height="36.0" rx="2"/>
  <rect class="body" x="522.0" y="256.0" width="64.0" height="44.0" rx="2"/>
  <rect class="body" x="526.0" y="204.0" width="64.0" height="52.0" rx="2"/>
  <rect class="body" x="519.0" y="164.0" width="64.0" height="40.0" rx="2"/>
  <rect class="body" x="524.0" y="116.0" width="64.0" height="48.0" rx="2"/>
  <rect class="body" x="520.0" y="80.0" width="64.0" height="36.0" rx="2"/>
  <rect class="body" x="14.0" y="71.0" width="582.0" height="9.0" rx="4"/>
  <text x="14.0" y="58.0">pencil or ruler across two stacks of books (stand)</text>
  <rect class="body" x="160.0" y="190.0" width="150.0" height="76.0" rx="3"/>
  <line class="line" x1="188.0" y1="80.0" x2="188.0" y2="190.0"/>
  <line class="line dash" x1="188.0" y1="190.0" x2="188.0" y2="266.0"/>
  <line class="line" x1="282.0" y1="80.0" x2="282.0" y2="190.0"/>
  <line class="line dash" x1="282.0" y1="190.0" x2="282.0" y2="266.0"/>
  <rect class="body-2" x="219.0" y="264.0" width="32.0" height="7.0"/>
  <rect class="dot" x="231.0" y="263.0" width="8" height="8"/>
  <path class="line" d="M235.0,271 L235.0,290 Q235.0,296 243.0,296 L355.0,296 L355.0,336" marker-end="url(#ah-ink)"/>
  <text x="365.0" y="326.0" class="note">lead to the thermometer / microcontroller</text>
  <text x="365.0" y="342.0" class="note">(dry end of the table)</text>
  <line class="thin" x1="282.0" y1="150.0" x2="326.0" y2="140.0"/>
  <text x="330.0" y="136.0">cotton string sling</text>
  <text x="330.0" y="152.0" class="note">(two loops)</text>
  <line class="thin" x1="312.0" y1="216.0" x2="326.0" y2="208.0"/>
  <text x="330.0" y="204.0">aluminium bar,</text>
  <text x="330.0" y="220.0" class="note">25.4 mm × 50 mm, horizontal</text>
  <line class="thin" x1="241.0" y1="268.0" x2="326.0" y2="256.0"/>
  <text x="330.0" y="252.0">probe tip or thermistor</text>
  <text x="330.0" y="268.0" class="note">under foil tape</text>
  <rect class="body" x="669.0" y="168.0" width="14.0" height="92.0" rx="7"/>
  <circle class="dot" cx="676.0" cy="268.0" r="11"/>
  <line class="line" x1="676.0" y1="276.0" x2="676.0" y2="300.0"/>
  <line class="line" x1="658.0" y1="300.0" x2="694.0" y2="300.0"/>
  <line class="force" x1="676.0" y1="262.0" x2="676.0" y2="184.0"/>
  <text x="714.0" y="94.0" text-anchor="end">room</text>
  <text x="714.0" y="110.0" text-anchor="end">thermometer</text>
  <text x="714.0" y="128.0" class="note" text-anchor="end">1 m away,</text>
  <text x="714.0" y="144.0" class="note" text-anchor="end">same height,</text>
  <text x="714.0" y="160.0" class="note" text-anchor="end">no draught</text>
</svg>
