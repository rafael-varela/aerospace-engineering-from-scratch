<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="720" height="362" role="img" aria-labelledby="title">
  <title id="title">The ideal Brayton cycle in two planes. In the T–s plane the isentropes 1–2 and 3–4 are vertical and the p₂ and p₁ isobars rise with entropy and diverge; heat q_in is added along 2–3 and q_out rejected along 4–1. In the p–v plane the isobars are horizontal and the isentropes curve; in both planes the area enclosed, traversed clockwise, is w_net.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
