<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="title">
  <title id="title">Air enters the compressor C at station 1 and leaves at 2 into the combustor CC, where the fuel adds heat q_in; it enters the turbine T at 3 and leaves as exhaust at 4, rejecting q_out to the atmosphere. A shaft carries turbine work w_t to the compressor, which absorbs w_c.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M90.0,66.0 L174.0,89.0 L174.0,135.0 L90.0,158.0 Z"/>
  <text x="132.0" y="117.0" class="head" text-anchor="middle">C</text>
  <rect class="body" x="238.0" y="86.0" width="116.0" height="52.0" rx="6"/>
  <text x="296.0" y="117.0" class="head" text-anchor="middle">CC</text>
  <path class="body" d="M418.0,89.0 L502.0,66.0 L502.0,158.0 L418.0,135.0 Z"/>
  <text x="460.0" y="117.0" class="head" text-anchor="middle">T</text>
  <line class="flow" x1="20.0" y1="112.0" x2="88.0" y2="112.0" marker-end="url(#ah-blue)"/>
  <text x="20.0" y="100.0" class="t-blue">air</text>
  <line class="flow" x1="174.0" y1="112.0" x2="236.0" y2="112.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="354.0" y1="112.0" x2="416.0" y2="112.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="502.0" y1="112.0" x2="586.0" y2="112.0" marker-end="url(#ah-blue)"/>
  <text x="532.0" y="100.0" class="t-blue">exhaust</text>
  <circle class="dot" cx="64.0" cy="112.0" r="3"/>
  <text x="64.0" y="136.0" class="head" text-anchor="middle">1</text>
  <circle class="dot" cx="206.0" cy="112.0" r="3"/>
  <text x="206.0" y="136.0" class="head" text-anchor="middle">2</text>
  <circle class="dot" cx="386.0" cy="112.0" r="3"/>
  <text x="386.0" y="136.0" class="head" text-anchor="middle">3</text>
  <circle class="dot" cx="516.0" cy="112.0" r="3"/>
  <text x="516.0" y="136.0" class="head" text-anchor="middle">4</text>
  <line class="force" x1="296.0" y1="34.0" x2="296.0" y2="82.0" marker-end="url(#ah-orange)"/>
  <text x="306.0" y="50.0" class="t-orange">fuel: heat q<tspan dy="4" font-size="0.75em">in</tspan><tspan dy="-4">​</tspan></text>
  <line class="line" x1="132.0" y1="136.0" x2="132.0" y2="182.0"/>
  <line class="line" x1="460.0" y1="138.0" x2="460.0" y2="182.0"/>
  <line class="line" x1="132.0" y1="182.0" x2="460.0" y2="182.0"/>
  <text x="296.0" y="174.0" class="note" text-anchor="middle">shaft</text>
  <line class="force" x1="436.0" y1="200.0" x2="156.0" y2="200.0" marker-end="url(#ah-orange)"/>
  <text x="468.0" y="206.0" class="sym t-orange">w<tspan dy="4" font-size="0.75em">t</tspan><tspan dy="-4">​</tspan></text>
  <text x="124.0" y="206.0" class="sym t-orange" text-anchor="end">w<tspan dy="4" font-size="0.75em">c</tspan><tspan dy="-4">​</tspan></text>
  <text x="296.0" y="220.0" class="note" text-anchor="middle">the turbine drives the compressor</text>
  <line class="force" x1="564.0" y1="118.0" x2="564.0" y2="168.0" marker-end="url(#ah-orange)"/>
  <text x="572.0" y="156.0" class="sym t-orange">q<tspan dy="4" font-size="0.75em">out</tspan><tspan dy="-4">​</tspan></text>
  <text x="534.0" y="188.0" class="note">to the atmosphere,</text>
  <text x="534.0" y="204.0" class="note">which closes the loop</text>
</svg>
