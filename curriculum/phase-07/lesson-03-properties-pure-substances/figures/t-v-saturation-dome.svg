<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="720" height="362" role="img" aria-labelledby="title">
  <title id="title">T–v diagram with v on a log scale: the saturated-liquid line v_f and the saturated-vapour line v_g form a dome that closes at the critical point. Compressed liquid lies to the left of the dome, saturated mixture inside it and superheated vapour to the right; an isobar crosses the dome horizontally at T_sat(p).</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="axis" x1="70.0" y1="330.0" x2="690.0" y2="330.0" marker-end="url(#ah-blue)"/>
  <line class="axis" x1="70.0" y1="330.0" x2="70.0" y2="34.0" marker-end="url(#ah-blue)"/>
  <text x="56.0" y="46.0" class="sym t-blue" text-anchor="end">T</text>
  <text x="690.0" y="354.0" class="t-blue" text-anchor="end">v (log scale)</text>
  <path class="body-2" style="stroke:none" d="M196.0,304.0 C200.0,184.0 214.0,120.0 250.0,92.0 C290.0,132.0 400.0,242.0 600.0,304.0 Z"/>
  <path class="line" d="M196.0,304.0 C200.0,184.0 214.0,120.0 250.0,92.0"/>
  <path class="line" d="M250.0,92.0 C290.0,132.0 400.0,242.0 600.0,304.0"/>
  <circle class="dot" cx="250.0" cy="92.0" r="4.5"/>
  <text x="262.0" y="82.0">critical point</text>
  <path class="force" d="M194.9,304 C195.9,276 197.9,246 199.9,236 L439.4,236 C499.4,214 549.4,166 579.4,118"/>
  <circle class="dot-o" cx="199.9" cy="236.0" r="3.5"/>
  <circle class="dot-o" cx="439.4" cy="236.0" r="3.5"/>
  <text x="585.4" y="112.0" class="t-orange">isobar</text>
  <text x="585.4" y="130.0" class="note t-orange">p = const</text>
  <text x="329.6" y="227.0" class="note t-orange" text-anchor="middle">T = T<tspan dy="4" font-size="0.75em">sat</tspan><tspan dy="-4">​</tspan>(p)</text>
  <text x="196.0" y="324.0" class="sym" text-anchor="middle">v<tspan dy="4" font-size="0.75em">f</tspan><tspan dy="-4">​</tspan></text>
  <text x="600.0" y="324.0" class="sym" text-anchor="middle">v<tspan dy="4" font-size="0.75em">g</tspan><tspan dy="-4">​</tspan></text>
  <line class="thin" x1="207.9" y1="160.0" x2="168.0" y2="200.0"/>
  <text x="164.0" y="212.0" class="note" text-anchor="end">saturated liquid</text>
  <text x="164.0" y="228.0" class="note" text-anchor="end">x = 0</text>
  <line class="thin" x1="333.0" y1="160.8" x2="360.0" y2="124.0"/>
  <text x="364.0" y="120.0" class="note">saturated vapour, x = 1</text>
  <text x="314.0" y="272.0" text-anchor="middle">saturated mixture</text>
  <text x="314.0" y="290.0" class="note" text-anchor="middle">x = 0 … 1</text>
  <text x="96.0" y="120.0">compressed</text>
  <text x="96.0" y="138.0">liquid</text>
  <text x="548.0" y="236.0">superheated</text>
  <text x="548.0" y="254.0">vapour</text>
</svg>
