<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" role="img" aria-labelledby="title">
  <title id="title">Turbojet core for the exergy audit: ambient air at station 0 (T₀, p₀, V₀) passes the inlet to 2, the compressor to 3, the combustor (where fuel is added) to 4, the turbine to 5 and the nozzle to the jet at 9 (T₉, p₀, V₉). A shaft connects the turbine to the compressor.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M92.0,90.0 L166.0,78.0 L166.0,162.0 L92.0,150.0 Z"/>
  <path class="body" d="M182.0,78.0 L286.0,99.0 L286.0,141.0 L182.0,162.0 Z"/>
  <text x="234.0" y="125.0" class="head" text-anchor="middle"></text>
  <rect class="body" x="300.0" y="92.0" width="104.0" height="56.0" rx="6"/>
  <path class="body" d="M418.0,99.0 L510.0,78.0 L510.0,162.0 L418.0,141.0 Z"/>
  <text x="464.0" y="125.0" class="head" text-anchor="middle"></text>
  <path class="body" d="M524.0,78.0 L594.0,94.0 L594.0,146.0 L524.0,162.0 Z"/>
  <text x="129.0" y="125.0" text-anchor="middle">inlet</text>
  <text x="234.0" y="125.0" text-anchor="middle">compressor</text>
  <text x="352.0" y="125.0" text-anchor="middle">combustor</text>
  <text x="464.0" y="125.0" text-anchor="middle">turbine</text>
  <text x="559.0" y="125.0" text-anchor="middle">nozzle</text>
  <line class="flow" x1="14.0" y1="120.0" x2="90.0" y2="120.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="594.0" y1="120.0" x2="706.0" y2="120.0" marker-end="url(#ah-blue)"/>
  <text x="30.0" y="58.0" class="head" text-anchor="middle">0</text>
  <line class="thin dash" x1="174.0" y1="64.0" x2="174.0" y2="166.0"/>
  <text x="174.0" y="58.0" class="head" text-anchor="middle">2</text>
  <line class="thin dash" x1="293.0" y1="64.0" x2="293.0" y2="166.0"/>
  <text x="293.0" y="58.0" class="head" text-anchor="middle">3</text>
  <line class="thin dash" x1="411.0" y1="64.0" x2="411.0" y2="166.0"/>
  <text x="411.0" y="58.0" class="head" text-anchor="middle">4</text>
  <line class="thin dash" x1="517.0" y1="64.0" x2="517.0" y2="166.0"/>
  <text x="517.0" y="58.0" class="head" text-anchor="middle">5</text>
  <line class="thin dash" x1="602.0" y1="64.0" x2="602.0" y2="166.0"/>
  <text x="602.0" y="58.0" class="head" text-anchor="middle">9</text>
  <text x="14.0" y="96.0" class="t-blue">ambient</text>
  <text x="14.0" y="146.0" class="note">(T₀, p₀, V₀)</text>
  <text x="706.0" y="96.0" class="t-blue" text-anchor="end">jet</text>
  <text x="706.0" y="146.0" class="note" text-anchor="end">(T₉, p₀, V₉)</text>
  <line class="force" x1="352.0" y1="36.0" x2="352.0" y2="88.0" marker-end="url(#ah-orange)"/>
  <text x="362.0" y="54.0" class="t-orange">fuel</text>
  <line class="line" x1="234.0" y1="146.0" x2="234.0" y2="196.0"/>
  <line class="line" x1="464.0" y1="150.0" x2="464.0" y2="196.0"/>
  <line class="line" x1="234.0" y1="196.0" x2="464.0" y2="196.0"/>
  <text x="349.0" y="216.0" class="note" text-anchor="middle">shaft: turbine power = compressor power</text>
</svg>
