<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="title">
  <title id="title">Cabin air system: outside air at 11 km (216.65 K, 22.6 kPa, ω_out about 5 × 10⁻⁵) is taken as engine bleed at about 200 °C, cooled in the pack, and the fresh flow ṁ_f joins the recirculated flow ṁ_r in the mixing manifold. The supply ṁ_s = ṁ_f + ṁ_r enters the cabin (22 °C, 75.3 kPa), which adds Q_sens and water ṁ_w; ṁ_f leaves overboard through the outflow valve. A dashed control volume encloses the manifold and cabin.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="body" x="16.0" y="40.0" width="170.0" height="70.0" rx="6"/>
  <text x="101.0" y="62.0" class="head" text-anchor="middle">outside, 11 km</text>
  <text x="101.0" y="80.0" class="note" text-anchor="middle">216.65 K, 22.6 kPa</text>
  <text x="101.0" y="98.0" class="note" text-anchor="middle">ω<tspan dy="4" font-size="0.75em">out</tspan><tspan dy="-4">​</tspan> ≈ 5 × 10⁻⁵</text>
  <rect class="body" x="275.0" y="40.0" width="170.0" height="70.0" rx="6"/>
  <text x="360.0" y="71.0" class="head" text-anchor="middle">engine bleed</text>
  <text x="360.0" y="89.0" class="note" text-anchor="middle">200 °C (illustrative)</text>
  <rect class="body" x="534.0" y="40.0" width="170.0" height="70.0" rx="6"/>
  <text x="619.0" y="71.0" class="head" text-anchor="middle">pack (cools)</text>
  <text x="619.0" y="89.0" class="note" text-anchor="middle">T<tspan dy="4" font-size="0.75em">pack</tspan><tspan dy="-4">​</tspan>, ω<tspan dy="4" font-size="0.75em">out</tspan><tspan dy="-4">​</tspan></text>
  <rect class="body" x="534.0" y="236.0" width="170.0" height="70.0" rx="6"/>
  <text x="619.0" y="267.0" class="head" text-anchor="middle">mixing manifold</text>
  <text x="619.0" y="285.0" class="note" text-anchor="middle">T<tspan dy="4" font-size="0.75em">supply</tspan><tspan dy="-4">​</tspan>, ω<tspan dy="4" font-size="0.75em">supply</tspan><tspan dy="-4">​</tspan></text>
  <rect class="body" x="275.0" y="236.0" width="170.0" height="70.0" rx="6"/>
  <text x="360.0" y="258.0" class="head" text-anchor="middle">cabin</text>
  <text x="360.0" y="276.0" class="note" text-anchor="middle">22 °C, 75.3 kPa</text>
  <text x="360.0" y="294.0" class="note" text-anchor="middle">T<tspan dy="4" font-size="0.75em">cabin</tspan><tspan dy="-4">​</tspan>, ω<tspan dy="4" font-size="0.75em">cabin</tspan><tspan dy="-4">​</tspan></text>
  <rect class="body" x="16.0" y="236.0" width="170.0" height="70.0" rx="6"/>
  <text x="101.0" y="276.0" class="head" text-anchor="middle">outflow valve</text>
  <line class="flow" x1="186.0" y1="75.0" x2="273.0" y2="75.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="445.0" y1="75.0" x2="532.0" y2="75.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="619.0" y1="110.0" x2="619.0" y2="234.0" marker-end="url(#ah-blue)"/>
  <text x="629.0" y="175.0" class="sym t-blue">ṁ<tspan dy="4" font-size="0.75em">f</tspan><tspan dy="-4">​</tspan></text>
  <text x="629.0" y="193.0" class="note t-blue">fresh</text>
  <line class="flow" x1="534.0" y1="271.0" x2="447.0" y2="271.0" marker-end="url(#ah-blue)"/>
  <text x="489.5" y="261.0" class="sym t-blue" text-anchor="middle">ṁ<tspan dy="4" font-size="0.75em">s</tspan><tspan dy="-4">​</tspan></text>
  <line class="flow" x1="275.0" y1="271.0" x2="188.0" y2="271.0" marker-end="url(#ah-blue)"/>
  <text x="230.5" y="261.0" class="sym t-blue" text-anchor="middle">ṁ<tspan dy="4" font-size="0.75em">f</tspan><tspan dy="-4">​</tspan></text>
  <line class="flow" x1="101.0" y1="306.0" x2="101.0" y2="358.0" marker-end="url(#ah-blue)"/>
  <text x="111.0" y="346.0" class="t-blue">ṁ<tspan dy="4" font-size="0.75em">f</tspan><tspan dy="-4">​</tspan> overboard</text>
  <path class="flow" d="M390.0,306 L390.0,346 L619.0,346 L619.0,308" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="619.0" y1="346.0" x2="619.0" y2="308.0" marker-end="url(#ah-blue)"/>
  <text x="504.5" y="338.0" class="t-blue" text-anchor="middle">recirculation ṁ<tspan dy="4" font-size="0.75em">r</tspan><tspan dy="-4">​</tspan></text>
  <text x="504.5" y="320.0" class="note" text-anchor="middle">ṁ<tspan dy="4" font-size="0.75em">s</tspan><tspan dy="-4">​</tspan> = ṁ<tspan dy="4" font-size="0.75em">f</tspan><tspan dy="-4">​</tspan> + ṁ<tspan dy="4" font-size="0.75em">r</tspan><tspan dy="-4">​</tspan></text>
  <line class="force" x1="320.0" y1="190.0" x2="320.0" y2="234.0" marker-end="url(#ah-orange)"/>
  <text x="314.0" y="184.0" class="t-orange" text-anchor="end">+ Q<tspan dy="4" font-size="0.75em">sens</tspan><tspan dy="-4">​</tspan></text>
  <line class="force" x1="400.0" y1="190.0" x2="400.0" y2="234.0" marker-end="url(#ah-orange)"/>
  <text x="406.0" y="184.0" class="t-orange">+ ṁ<tspan dy="4" font-size="0.75em">w</tspan><tspan dy="-4">​</tspan> water</text>
  <rect class="thin dash" x="263.0" y="220.0" width="453.0" height="152.0" rx="10"/>
  <text x="716.0" y="392.0" class="note" text-anchor="end">dashed: control volume for the water balance</text>
</svg>
