  <text x="608.0" y="39.1">p₁ isobar</text>
  <text x="368.0" y="53.7">p₂ isobar</text>
  <line class="thin dash" x1="210.0" y1="275.1" x2="210.0" y2="191.9" marker-end="url(#ah-ink2)"/>
  <path class="force dash" d="M210,279.1489464606935 Q256.0,232.4 258.4,155.6" marker-end="url(#ah-orange)"/>
  <circle class="dot" cx="210.0" cy="279.1" r="4"/>
  <text x="222.0" y="295.1" class="head">1</text>
  <circle class="dot" cx="210.0" cy="185.9" r="4"/>
  <text x="200.0" y="177.9" class="head" text-anchor="end">2s</text>
  <circle class="dot" cx="260.4" cy="149.6" r="4"/>
  <text x="250.4" y="137.6" class="head" text-anchor="end">2 (actual)</text>
  <line class="thin dash" x1="138.0" y1="279.1" x2="202.0" y2="279.1"/>
  <line class="thin dash" x1="138.0" y1="185.9" x2="202.0" y2="185.9"/>
  <line class="thin" x1="146.0" y1="277.1" x2="146.0" y2="187.9" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="138.0" y="238.5" class="sym" text-anchor="end">w<tspan dy="4" font-size="0.75em">s</tspan><tspan dy="-4">​</tspan></text>
  <line class="thin dash" x1="218.0" y1="279.1" x2="342.4" y2="279.1"/>
  <line class="thin dash" x1="268.4" y1="149.6" x2="342.4" y2="149.6"/>
  <line class="thin" x1="334.4" y1="277.1" x2="334.4" y2="151.6" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="344.4" y="220.4" class="sym">w</text>
  <line class="thin dash" x1="210.0" y1="285.1" x2="210.0" y2="331.1"/>
  <line class="thin dash" x1="260.4" y1="155.6" x2="260.4" y2="331.1"/>
  <line class="thin" x1="212.0" y1="323.1" x2="258.4" y2="323.1" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="270.4" y="328.1">s₂ − s₁ = s<tspan dy="4" font-size="0.75em">gen</tspan><tspan dy="-4">​</tspan> &gt; 0</text>
  <text x="430.0" y="252.0">w = h₂ − h₁  &gt;  w<tspan dy="4" font-size="0.75em">s</tspan><tspan dy="-4">​</tspan> = h₂ₛ − h₁</text>
  <text x="430.0" y="274.0" class="note">the real path (dashed) does not pass</text>
  <text x="430.0" y="290.0" class="note">through equilibrium states; only its</text>
  <text x="430.0" y="306.0" class="note">end points 1 and 2 are states</text>
</svg>
