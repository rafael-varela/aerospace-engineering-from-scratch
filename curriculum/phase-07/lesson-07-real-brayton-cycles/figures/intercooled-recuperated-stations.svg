<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 238" width="720" height="238" role="img" aria-labelledby="title">
  <title id="title">Station layout of the intercooled, recuperated cycle: air enters the LP compressor at 1, leaves at 2, is cooled in the intercooler (q_ic out) to 3, compressed in the HP compressor to 4, heated on the recuperator cold side to 5, heated in the combustor to the turbine inlet 6, expanded to 7, and returned through the recuperator hot side to the exhaust at 8 (q_ex out). The recuperator heat q_rec passes from the hot side to the cold side inside the cycle.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M44.0,72.0 L102.0,88.0 L102.0,120.0 L44.0,136.0 Z"/>
  <text x="73.0" y="109.0" class="head" text-anchor="middle">LPC</text>
  <rect class="body" x="134.0" y="82.0" width="40.0" height="44.0" rx="4"/>
  <text x="154.0" y="109.0" class="head" text-anchor="middle">IC</text>
  <path class="body" d="M206.0,72.0 L264.0,88.0 L264.0,120.0 L206.0,136.0 Z"/>
  <text x="235.0" y="109.0" class="head" text-anchor="middle">HPC</text>
  <rect class="body" x="304.0" y="78.0" width="104.0" height="108.0" rx="4"/>
  <line class="thin dash" x1="304.0" y1="132.0" x2="408.0" y2="132.0"/>
  <text x="356.0" y="98.0" class="note" text-anchor="middle">cold side</text>
  <text x="356.0" y="178.0" class="note" text-anchor="middle">hot side</text>
  <rect class="body" x="446.0" y="80.0" width="56.0" height="48.0" rx="6"/>
  <text x="474.0" y="109.0" class="head" text-anchor="middle">CC</text>
  <path class="body" d="M538.0,88.0 L596.0,72.0 L596.0,136.0 L538.0,120.0 Z"/>
  <text x="567.0" y="109.0" class="head" text-anchor="middle">T</text>
  <text x="154.0" y="40.0" text-anchor="middle">intercooler</text>
  <text x="356.0" y="40.0" text-anchor="middle">recuperator</text>
  <text x="356.0" y="56.0" class="note" text-anchor="middle">q<tspan dy="4" font-size="0.75em">rec</tspan><tspan dy="-4">​</tspan> stays inside the cycle</text>
  <line class="flow" x1="6.0" y1="104.0" x2="42.0" y2="104.0" marker-end="url(#ah-blue)"/>
  <text x="6.0" y="128.0" class="t-blue">air</text>
  <line class="flow" x1="102.0" y1="104.0" x2="132.0" y2="104.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="174.0" y1="104.0" x2="204.0" y2="104.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="264.0" y1="104.0" x2="302.0" y2="104.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="408.0" y1="104.0" x2="444.0" y2="104.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="502.0" y1="104.0" x2="536.0" y2="104.0" marker-end="url(#ah-blue)"/>
  <path class="flow" d="M596,104 L666,104 L666,160 L410,160" marker-end="url(#ah-blue)"/>
  <path class="flow" d="M304,160 L264,160 L264,210" marker-end="url(#ah-blue)"/>
  <text x="256.0" y="204.0" class="t-blue" text-anchor="end">exhaust</text>
  <circle class="dot" cx="26.0" cy="104.0" r="3"/>
  <text x="26.0" y="94.0" class="head" text-anchor="middle">1</text>
  <circle class="dot" cx="118.0" cy="104.0" r="3"/>
  <text x="118.0" y="94.0" class="head" text-anchor="middle">2</text>
  <circle class="dot" cx="190.0" cy="104.0" r="3"/>
  <text x="190.0" y="94.0" class="head" text-anchor="middle">3</text>
  <circle class="dot" cx="284.0" cy="104.0" r="3"/>
  <text x="284.0" y="94.0" class="head" text-anchor="middle">4</text>
  <circle class="dot" cx="427.0" cy="104.0" r="3"/>
  <text x="427.0" y="94.0" class="head" text-anchor="middle">5</text>
  <circle class="dot" cx="520.0" cy="104.0" r="3"/>
  <text x="520.0" y="94.0" class="head" text-anchor="middle">6</text>
  <circle class="dot" cx="626.0" cy="104.0" r="3"/>
  <text x="626.0" y="94.0" class="head" text-anchor="middle">7</text>
  <circle class="dot" cx="286.0" cy="160.0" r="3"/>
  <text x="286.0" y="150.0" class="head" text-anchor="middle">8</text>
  <line class="force" x1="154.0" y1="128.0" x2="154.0" y2="180.0" marker-end="url(#ah-orange)"/>
  <text x="154.0" y="200.0" class="t-orange" text-anchor="middle">q<tspan dy="4" font-size="0.75em">ic</tspan><tspan dy="-4">​</tspan> out</text>
  <line class="force" x1="356.0" y1="152.0" x2="356.0" y2="114.0" marker-end="url(#ah-orange)"/>
  <text x="364.0" y="126.0" class="t-orange">q<tspan dy="4" font-size="0.75em">rec</tspan><tspan dy="-4">​</tspan></text>
  <line class="force" x1="474.0" y1="32.0" x2="474.0" y2="76.0" marker-end="url(#ah-orange)"/>
  <text x="482.0" y="46.0" class="t-orange">q<tspan dy="4" font-size="0.75em">in</tspan><tspan dy="-4">​</tspan></text>
  <text x="256.0" y="222.0" class="t-orange" text-anchor="end">(q<tspan dy="4" font-size="0.75em">ex</tspan><tspan dy="-4">​</tspan> out)</text>
</svg>
