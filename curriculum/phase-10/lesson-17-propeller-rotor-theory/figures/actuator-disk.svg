<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" width="720" height="435" role="img" aria-labelledby="title">
  <title id="title">An actuator disk of area A, with a pressure jump Δp, inside a stream tube. Far ahead the air moves at V, at the disk at V + v and far behind, in the contracted slipstream, at V + w. Below, the axial speed along the tube rises smoothly from V through V + v at the disk to V + w far behind.</title>
