<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="title">
  <title id="title">Front view, looking upstream, of a wing at height h above the ground plane z = 0, its trailing vortices of circulation Γ seen end-on at the tips, and its mirror image at −h with circulation −Γ and the opposite sense of rotation. At a point on the ground the velocities induced by a tip vortex and its image have equal and opposite vertical parts, so their sum lies along the ground.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="40" y="200" width="620" height="14"/>
  <line class="line" x1="40.0" y1="200.0" x2="660.0" y2="200.0"/>
  <text x="40.0" y="190.0" class="note">ground, z = 0</text>
  <text x="40.0" y="234.0" class="note">w = 0 on the plane</text>
  <line class="thin dash" x1="330.0" y1="287.0" x2="330.0" y2="113.0"/>
  <line class="axis" x1="635.0" y1="60.0" x2="675.0" y2="60.0" marker-end="url(#ah-blue)"/>
  <text x="681.0" y="65.0" class="sym t-blue">y</text>
  <line class="axis" x1="635.0" y1="60.0" x2="635.0" y2="22.0" marker-end="url(#ah-blue)"/>
  <text x="641.0" y="28.0" class="sym t-blue">z</text>
  <circle class="axis" cx="635.0" cy="60.0" r="5.0"/>
  <circle class="ah-blue" cx="635" cy="60" r="1.8"/>
  <text x="620.0" y="42.0" class="note" text-anchor="end">x out of the page</text>
  <text x="620.0" y="58.0" class="note" text-anchor="end">(looking upstream)</text>
  <line class="line" style="stroke-width:4" x1="110.0" y1="105.0" x2="550.0" y2="105.0"/>
  <circle class="dot" cx="550.0" cy="105.0" r="5"/>
  <path class="thin" d="M 569.9,121.7 A 26,26 0 1 0 530.1,121.7" marker-end="url(#ah-ink2)"/>
  <circle class="dot" cx="110.0" cy="105.0" r="5"/>
  <path class="thin" d="M 90.1,121.7 A 26,26 0 1 1 129.9,121.7" marker-end="url(#ah-ink2)"/>
  <text x="330.0" y="71.0" text-anchor="middle">wing at height h: circulation Γ</text>
  <text x="330.0" y="91.0" class="note" text-anchor="middle">trailing legs to +x, seen end-on at the tips</text>
  <line class="line dash" style="stroke-width:3" x1="110.0" y1="295.0" x2="550.0" y2="295.0"/>
  <circle class="line" cx="550.0" cy="295.0" r="5.0"/>
  <path class="thin" d="M 530.1,311.7 A 26,26 0 1 1 569.9,311.7" marker-end="url(#ah-ink2)"/>
  <circle class="line" cx="110.0" cy="295.0" r="5.0"/>
  <path class="thin" d="M 129.9,311.7 A 26,26 0 1 0 90.1,311.7" marker-end="url(#ah-ink2)"/>
  <text x="330.0" y="325.0" text-anchor="middle">image at −h: circulation −Γ</text>
  <text x="330.0" y="343.0" class="note" text-anchor="middle">mirror of the lattice, z → −z, Γ → −Γ</text>
  <line class="thin" x1="642.0" y1="200.0" x2="642.0" y2="111.0" marker-end="url(#ah-ink2)"/>
  <text x="650.0" y="158.5" class="sym">h</text>
  <line class="thin" x1="642.0" y1="200.0" x2="642.0" y2="289.0" marker-end="url(#ah-ink2)"/>
  <text x="650.0" y="253.5" class="sym">h</text>
  <line class="force" style="stroke-width:1.8" x1="400.0" y1="200.0" x2="436.0" y2="256.8" marker-end="url(#ah-orange)"/>
  <line class="force dash" style="stroke-width:1.8" x1="400.0" y1="200.0" x2="436.0" y2="143.2" marker-end="url(#ah-orange)"/>
  <line class="force" x1="400.0" y1="200.0" x2="467.9" y2="200.0" marker-end="url(#ah-orange)"/>
  <circle class="dot" cx="400.0" cy="200.0" r="3.5"/>
  <text x="390.0" y="258.8" class="note t-orange" text-anchor="end">from Γ</text>
  <text x="390.0" y="155.2" class="note t-orange" text-anchor="end">from −Γ</text>
  <text x="485.9" y="230.0" class="note t-orange">sum: along the ground</text>
</svg>
