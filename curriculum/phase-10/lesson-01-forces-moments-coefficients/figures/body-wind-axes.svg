<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="title">
  <title id="title">Airfoil with body axes x along the chord and z normal to it; the stream arrives at angle α to the chord; lift L is perpendicular to the stream and drag D along it, while the balance measures the normal force N and axial force A.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M560.0,175.0 L559.8,174.9 L559.0,174.8 L557.8,174.5 L556.1,174.1 L553.9,173.6 L551.2,173.1 L548.0,172.4 L544.4,171.6 L540.4,170.8 L535.9,169.8 L531.0,168.9 L525.6,167.8 L519.9,166.7 L513.8,165.6 L507.3,164.4 L500.4,163.2 L493.3,162.0 L485.8,160.8 L478.0,159.6 L470.0,158.4 L461.7,157.2 L453.2,156.0 L444.5,154.9 L435.6,153.8 L426.6,152.8 L417.4,151.9 L408.2,151.0 L398.8,150.2 L389.4,149.4 L380.0,148.8 L370.6,148.2 L361.2,147.8 L351.8,147.4 L342.6,147.2 L333.4,147.1 L324.4,147.0 L315.5,147.2 L306.8,147.4 L298.3,147.7 L290.0,148.2 L282.0,148.8 L274.2,149.5 L266.7,150.3 L259.6,151.3 L252.7,152.3 L246.2,153.4 L240.1,154.6 L234.4,155.9 L229.0,157.3 L224.1,158.7 L219.6,160.2 L215.6,161.8 L212.0,163.4 L208.8,165.0 L206.1,166.6 L203.9,168.3 L202.2,170.0 L201.0,171.6 L200.2,173.3 L200.0,175.0 L200.2,176.6 L201.0,178.2 L202.2,179.7 L203.9,181.1 L206.1,182.4 L208.8,183.6 L212.0,184.8 L215.6,185.8 L219.6,186.8 L224.1,187.7 L229.0,188.4 L234.4,189.1 L240.1,189.7 L246.2,190.1 L252.7,190.5 L259.6,190.8 L266.7,191.0 L274.2,191.1 L282.0,191.1 L290.0,191.0 L298.3,190.8 L306.8,190.6 L315.5,190.3 L324.4,189.9 L333.4,189.5 L342.6,189.0 L351.8,188.5 L361.2,188.0 L370.6,187.4 L380.0,186.8 L389.4,186.2 L398.8,185.6 L408.2,185.0 L417.4,184.4 L426.6,183.7 L435.6,183.1 L444.5,182.5 L453.2,182.0 L461.7,181.4 L470.0,180.8 L478.0,180.3 L485.8,179.8 L493.3,179.3 L500.4,178.8 L507.3,178.4 L513.8,178.0 L519.9,177.6 L525.6,177.2 L531.0,176.9 L535.9,176.6 L540.4,176.3 L544.4,176.0 L548.0,175.8 L551.2,175.6 L553.9,175.4 L556.1,175.3 L557.8,175.1 L559.0,175.1 L559.8,175.0 L560.0,175.0 Z"/>
  <line class="axis" x1="160" y1="175" x2="630" y2="175" marker-end="url(#ah-blue)"/>
  <text x="630.0" y="197.0" class="sym t-blue" text-anchor="end">x</text>
  <text x="630.0" y="215.0" class="note" text-anchor="end">chord, aft</text>
  <line class="axis" x1="290.0" y1="235" x2="290.0" y2="25" marker-end="url(#ah-blue)"/>
  <text x="280.0" y="37.0" class="sym t-blue" text-anchor="end">z</text>
  <line class="flow" x1="40" y1="192" x2="157.4" y2="167.1" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="40" y1="230" x2="157.4" y2="205.1" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="40" y1="268" x2="157.4" y2="243.1" marker-end="url(#ah-blue)"/>
  <text x="40.0" y="173.0" class="sym t-blue">V</text>
  <text x="52.0" y="177.0" class="note t-blue">∞</text>
  <line class="thin dash" x1="40" y1="230" x2="165" y2="230"/>
  <path class="thin" d="M135,230 A95,95 0 0 0 132.9,210.2"/>
  <text x="141.0" y="226.0" class="sym">α</text>
  <line class="force" x1="290.0" y1="175.0" x2="265.1" y2="57.6" marker-end="url(#ah-orange)"/>
  <text x="257.1" y="51.6" class="sym t-orange" text-anchor="end">L</text>
  <line class="force" x1="290.0" y1="175.0" x2="340.9" y2="164.2" marker-end="url(#ah-orange)"/>
  <text x="346.9" y="168.2" class="sym t-orange">D</text>
  <line class="thin dash" x1="265.1" y1="57.6" x2="315.9" y2="46.8"/>
  <line class="thin dash" x1="340.9" y1="164.2" x2="315.9" y2="46.8"/>
  <line class="force dash" x1="314.0" y1="175.0" x2="314.0" y2="46.8" marker-end="url(#ah-orange)"/>
  <text x="322.0" y="54.8" class="sym t-orange">N</text>
  <line class="force dash" x1="290.0" y1="199.0" x2="315.9" y2="199.0" marker-end="url(#ah-orange)"/>
  <text x="323.9" y="205.0" class="sym t-orange">A</text>
  <circle class="dot" cx="290.0" cy="175" r="3.5"/>
  <text x="440.0" y="40.0" class="note">Body axes: N, A (dashed)</text>
  <text x="440.0" y="58.0" class="note">Wind axes: L ⟂ stream, D along it (solid)</text>
  <text x="440.0" y="76.0" class="note">α drawn at 12° for clarity</text>
</svg>
