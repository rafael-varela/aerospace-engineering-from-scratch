<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" width="720" height="365" role="img" aria-labelledby="title">
  <title id="title">Free-body diagram of a main wheel at touchdown: the axle and its share of the aircraft, mass M, move forward at V; the wheel, of moment of inertia I about the axle and radius R, spins at ω, positive clockwise when rolling forward; at the contact the runway pushes up with N and backward with the friction force F while the tyre slips forward at v_s = V − ωR.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="40.0" y="270.0" width="520.0" height="10.0"/>
  <line class="line" x1="40.0" y1="270.0" x2="560.0" y2="270.0"/>
  <text x="552.0" y="300.0" class="note" text-anchor="end">runway</text>
  <circle class="body" cx="260.0" cy="175.0" r="95.0"/>
  <circle class="thin" cx="260.0" cy="175.0" r="73.0"/>
  <line class="line" style="stroke-width:5" x1="260.0" y1="175.0" x2="260.0" y2="40.0"/>
  <circle class="body" cx="260.0" cy="175.0" r="6.0"/>
  <text x="272.0" y="50.0">axle (share of aircraft, mass M)</text>
  <line class="axis" x1="270.0" y1="70.0" x2="350.0" y2="70.0" marker-end="url(#ah-blue)"/>
  <text x="356.0" y="75.0" class="sym t-blue">V</text>
  <line class="thin" x1="260.0" y1="175.0" x2="173.9" y2="134.9" marker-end="url(#ah-ink2)"/>
  <text x="216.0" y="141.0" class="sym" text-anchor="middle">R</text>
  <path class="axis" style="stroke-width:2" d="M298.1,197.0 A44,44 0 0 1 221.9,197.0" marker-end="url(#ah-blue)"/>
  <text x="304.0" y="219.0" class="sym t-blue">ω</text>
  <line class="force" x1="264.0" y1="270.0" x2="170.0" y2="270.0" marker-end="url(#ah-orange)"/>
  <text x="166.0" y="262.0" class="sym t-orange" text-anchor="end">F</text>
  <line class="force" x1="260.0" y1="348.0" x2="260.0" y2="276.0" marker-end="url(#ah-orange)"/>
  <text x="270.0" y="340.0" class="sym t-orange">N</text>
  <circle class="dot" cx="260.0" cy="270.0" r="4.0"/>
  <text x="390.0" y="140.0">wheel: I about the axle, radius R</text>
  <text x="390.0" y="166.0" class="note">ω positive when rolling forward</text>
  <text x="390.0" y="182.0" class="note">(clockwise in this view)</text>
  <text x="274.0" y="316.0" class="note">contact: slips forward at v<tspan dy="4" style="font-size:12.5px">s</tspan><tspan dy="-4"> = V − ωR</tspan></text>
</svg>
