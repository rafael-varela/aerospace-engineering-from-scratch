<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="title">
  <title id="title">Double pendulum hanging from a pivot O at the hover point: link l1 to the hook block m1 at angle θ1 from the downward vertical, then link l2 to the load m2 at angle θ2 from the vertical; y is up, x right, and both angles are positive counter-clockwise.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="220.0" y="48.0" width="80.0" height="12.0"/>
  <line class="line" x1="220.0" y1="60.0" x2="300.0" y2="60.0"/>
  <line class="line" x1="260.0" y1="60.0" x2="260.0" y2="70.0"/>
  <text x="310.0" y="58.0">O  pivot (hover point)</text>
  <line class="line" x1="260.0" y1="70.0" x2="335.1" y2="211.3"/>
  <line class="line" x1="335.1" y1="211.3" x2="439.2" y2="304.9"/>
  <line class="thin dash" x1="260.0" y1="70.0" x2="260.0" y2="250.0"/>
  <line class="thin dash" x1="335.1" y1="211.3" x2="335.1" y2="337.3"/>
  <path class="thin" d="M260.0,165.0 A95,95 0 0 0 304.6,153.9" marker-end="url(#ah-ink2)"/>
  <text x="282.0" y="188.0" class="sym">θ₁</text>
  <path class="thin" d="M335.1,291.3 A80,80 0 0 0 394.6,264.8" marker-end="url(#ah-ink2)"/>
  <text x="365.1" y="307.3" class="sym">θ₂</text>
  <circle class="body" cx="260.0" cy="70.0" r="4.5"/>
  <circle class="body" cx="335.1" cy="211.3" r="9.0"/>
  <circle class="body" cx="439.2" cy="304.9" r="14.0"/>
  <text x="309.6" y="140.6" class="sym">l₁</text>
  <text x="399.1" y="252.1" class="sym">l₂</text>
  <text x="353.1" y="215.3" class="sym">m₁</text>
  <text x="381.1" y="215.3" class="note">(hook block)</text>
  <text x="461.2" y="310.9" class="sym">m₂</text>
  <text x="489.2" y="310.9" class="note">(load)</text>
  <line class="axis" x1="70.0" y1="330.0" x2="120.0" y2="330.0" marker-end="url(#ah-blue)"/>
  <line class="axis" x1="70.0" y1="330.0" x2="70.0" y2="280.0" marker-end="url(#ah-blue)"/>
  <text x="126.0" y="335.0" class="sym t-blue">x</text>
  <text x="66.0" y="274.0" class="sym t-blue">y</text>
  <text x="450.0" y="110.0" class="note">θ₁, θ₂ from the downward vertical,</text>
  <text x="450.0" y="127.0" class="note">positive counter-clockwise</text>
</svg>
