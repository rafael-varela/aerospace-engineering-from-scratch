<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" width="720" height="394" role="img" aria-labelledby="title">
  <title id="title">Spacecraft stack modelled as three lumped masses on axial springs above the launch-vehicle interface, which has prescribed motion y: spring k1 = 6.0e8 N/m joins the interface to the adapter m1 = 150 kg, k2 = 4.0e8 N/m joins it to the service module m2 = 600 kg, and k3 = 2.5e8 N/m joins that to the payload m3 = 350 kg, with displacements x1, x2, x3.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="body" x="245.0" y="30.0" width="170.0" height="46.0"/>
  <text x="330.0" y="50.0" text-anchor="middle">payload</text>
  <text x="330" y="68" text-anchor="middle"><tspan class="sym">m₃</tspan> = 350 kg</text>
  <line class="axis" x1="445.0" y1="71.0" x2="445.0" y2="35.0" marker-end="url(#ah-blue)"/>
  <line class="thin" x1="421.0" y1="71.0" x2="455.0" y2="71.0"/>
  <text x="455.0" y="47.0" class="sym t-blue">x₃</text>
  <path class="line" d="M330.0,76.0 L330.0,87.2 L343.0,89.6 L317.0,94.6 L343.0,99.6 L317.0,104.5 L343.0,109.5 L317.0,114.4 L343.0,119.4 L317.0,124.4 L330.0,126.8 L330.0,138.0"/>
  <text x="358" y="112.0"><tspan class="sym">k₃</tspan> = 2.5 × 10⁸ N/m</text>
  <rect class="body" x="245.0" y="138.0" width="170.0" height="46.0"/>
  <text x="330.0" y="158.0" text-anchor="middle">service</text>
  <text x="330" y="176" text-anchor="middle"><tspan class="sym">m₂</tspan> = 600 kg</text>
  <line class="axis" x1="445.0" y1="179.0" x2="445.0" y2="143.0" marker-end="url(#ah-blue)"/>
  <line class="thin" x1="421.0" y1="179.0" x2="455.0" y2="179.0"/>
  <text x="455.0" y="155.0" class="sym t-blue">x₂</text>
  <path class="line" d="M330.0,184.0 L330.0,195.2 L343.0,197.6 L317.0,202.6 L343.0,207.6 L317.0,212.5 L343.0,217.5 L317.0,222.4 L343.0,227.4 L317.0,232.4 L330.0,234.8 L330.0,246.0"/>
  <text x="358" y="220.0"><tspan class="sym">k₂</tspan> = 4.0 × 10⁸ N/m</text>
  <rect class="body" x="245.0" y="246.0" width="170.0" height="46.0"/>
  <text x="330.0" y="266.0" text-anchor="middle">adapter</text>
  <text x="330" y="284" text-anchor="middle"><tspan class="sym">m₁</tspan> = 150 kg</text>
  <line class="axis" x1="445.0" y1="287.0" x2="445.0" y2="251.0" marker-end="url(#ah-blue)"/>
  <line class="thin" x1="421.0" y1="287.0" x2="455.0" y2="287.0"/>
  <text x="455.0" y="263.0" class="sym t-blue">x₁</text>
  <path class="line" d="M330.0,292.0 L330.0,303.2 L343.0,305.6 L317.0,310.6 L343.0,315.6 L317.0,320.5 L343.0,325.5 L317.0,330.4 L343.0,335.4 L317.0,340.4 L330.0,342.8 L330.0,354.0"/>
  <text x="358" y="328.0"><tspan class="sym">k₁</tspan> = 6.0 × 10⁸ N/m</text>
  <rect class="ground" x="215.0" y="354.0" width="230.0" height="12.0"/>
  <line class="line" x1="215.0" y1="354.0" x2="445.0" y2="354.0"/>
  <text x="205.0" y="358.0" text-anchor="end">LV interface</text>
  <text x="205.0" y="375.0" class="note" text-anchor="end">(prescribed motion y)</text>
  <line class="axis" x1="475.0" y1="368.0" x2="475.0" y2="332.0" marker-end="url(#ah-blue)"/>
  <text x="483.0" y="346.0" class="sym t-blue">y</text>
  <text x="560.0" y="60.0" class="note">axial displacements,</text>
  <text x="560.0" y="77.0" class="note">positive up</text>
</svg>
