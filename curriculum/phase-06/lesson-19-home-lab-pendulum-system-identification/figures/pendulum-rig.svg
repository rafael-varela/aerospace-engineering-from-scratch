<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 422" width="720" height="422" role="img" aria-labelledby="title">
  <title id="title">The pendulum rig as seen from the camera: a string pinched in a clip at the pivot on a rigid support hangs a bob with a contrast marker; L is the length from the pivot to the centre of the bob; a protractor or grid is taped behind the pivot in the swing plane; the swing arc plus 0.5 m is kept clear.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="120.0" y="54.0" width="360.0" height="14.0"/>
  <line class="line" x1="120.0" y1="68.0" x2="480.0" y2="68.0"/>
  <text x="300.0" y="40.0" text-anchor="middle">rigid support (the p04-pendulum stick or door-frame clamp)</text>
  <path class="body-2" d="M230,80 A70,70 0 0 0 370,80 Z"/>
  <line class="thin" x1="256.7" y1="105.0" x2="239.4" y2="115.0"/>
  <line class="thin" x1="255.6" y1="117.3" x2="246.4" y2="125.0"/>
  <line class="thin" x1="262.7" y1="124.4" x2="255.0" y2="133.6"/>
  <line class="thin" x1="275.0" y1="123.3" x2="265.0" y2="140.6"/>
  <line class="thin" x1="280.2" y1="134.5" x2="276.1" y2="145.8"/>
  <line class="thin" x1="289.9" y1="137.1" x2="287.8" y2="148.9"/>
  <line class="thin" x1="300.0" y1="130.0" x2="300.0" y2="150.0"/>
  <line class="thin" x1="310.1" y1="137.1" x2="312.2" y2="148.9"/>
  <line class="thin" x1="319.8" y1="134.5" x2="323.9" y2="145.8"/>
  <line class="thin" x1="325.0" y1="123.3" x2="335.0" y2="140.6"/>
  <line class="thin" x1="337.3" y1="124.4" x2="345.0" y2="133.6"/>
  <line class="thin" x1="344.4" y1="117.3" x2="353.6" y2="125.0"/>
  <line class="thin" x1="343.3" y1="105.0" x2="360.6" y2="115.0"/>
  <rect class="body" x="291.0" y="68.0" width="18.0" height="14.0"/>
  <line class="line" x1="300.0" y1="80.0" x2="300.0" y2="290.0"/>
  <circle class="body" cx="300.0" cy="290.0" r="16.0"/>
  <circle class="dot-o" cx="300.0" cy="290.0" r="5.0"/>
  <path class="thin dash" d="M201.4,265.4 A210,210 0 0 0 398.6,265.4" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="193.4" y="269.4" class="note" text-anchor="end">arc</text>
  <text x="406.6" y="269.4" class="note">arc</text>
  <line class="thin" x1="324.0" y1="80.0" x2="324.0" y2="290.0" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="332.0" y="215.0" class="sym">L</text>
  <text x="348.0" y="215.0" class="note">pivot to the centre of the bob (or phone)</text>
  <text x="382.0" y="84.0" class="note">pivot: string pinched in a clip</text>
  <text x="222.0" y="110.0" class="note" text-anchor="end">protractor or grid</text>
  <text x="222.0" y="126.0" class="note" text-anchor="end">taped flat behind the pivot,</text>
  <text x="222.0" y="142.0" class="note" text-anchor="end">in the swing plane</text>
  <text x="322.0" y="322.0" class="note">contrast marker on the bob</text>
  <text x="300.0" y="356.0" class="note" text-anchor="middle">keep the arc + 0.5 m clear</text>
  <text x="30.0" y="390.0" class="note">Recommended: phone in a padded pouch as the bob, gyroscope logged.  Enhanced: IMU taped to the bob.</text>
  <text x="30.0" y="408.0" class="note">Video: phone on a stand 1.5–2 m back, square to the swing plane (this view).</text>
</svg>
