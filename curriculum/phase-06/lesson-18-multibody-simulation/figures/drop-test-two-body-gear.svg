<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466.6135811493392" width="720" height="466.6135811493392" role="img" aria-labelledby="title">
  <title id="title">Two-body drop-test model of a landing gear: body 1, the airframe or drop carriage of mass M, slides in a vertical guide and carries lift L = W; the strut, raked at angle β from the vertical along axis e, joins it to body 2 (piston, axle and wheel, mass m) through a sliding joint, with strut force F along e and stroke s; the tyre force F_t acts vertically at the axle from the frictionless ground.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="224.0" y="60.0" width="14.0" height="140.0"/>
  <line class="line" x1="238.0" y1="60.0" x2="238.0" y2="200.0"/>
  <rect class="ground" x="422.0" y="60.0" width="14.0" height="140.0"/>
  <line class="line" x1="422.0" y1="60.0" x2="422.0" y2="200.0"/>
  <rect class="body" x="244.0" y="90.0" width="172.0" height="90.0"/>
  <text x="250.0" y="110.0" class="head">body 1</text>
  <circle class="dot" cx="330.0" cy="140.0" r="5.0"/>
  <circle class="body" cx="241.0" cy="105.0" r="3.0"/>
  <circle class="body" cx="419.0" cy="105.0" r="3.0"/>
  <circle class="body" cx="241.0" cy="165.0" r="3.0"/>
  <circle class="body" cx="419.0" cy="165.0" r="3.0"/>
  <line class="force" x1="300.0" y1="90.0" x2="300.0" y2="40.0" marker-end="url(#ah-orange)"/>
  <text x="308.0" y="50.0" class="sym t-orange">L = W</text>
  <text x="436.0" y="54.0" class="note">guide (x₁ = 0, θ₁ = 0)</text>
  <path class="body" d="M283.8,350.1 L312.8,233.6 L301.2,230.7 L272.2,347.2 Z"/>
  <path class="body" d="M342.6,143.1 L313.6,259.6 L288.4,253.3 L317.4,136.9 Z"/>
  <circle class="body-2" cx="278.0" cy="348.6" r="48.0"/>
  <circle class="body" cx="278.0" cy="348.6" r="5.0"/>
  <circle class="dot" cx="330.0" cy="140.0" r="5.0"/>
  <rect class="ground" x="140.0" y="396.6" width="420.0" height="10.0"/>
  <line class="line" x1="140.0" y1="396.6" x2="560.0" y2="396.6"/>
  <text x="552.0" y="426.6" class="note" text-anchor="end">ground: no friction</text>
  <line class="thin dash" x1="330.0" y1="140.0" x2="330.0" y2="330.0"/>
  <path class="thin" d="M330.0,310.0 A170,170 0 0 1 288.9,305.0" marker-end="url(#ah-ink2)"/>
  <text x="322.0" y="298.0" class="sym" text-anchor="end">β</text>
  <line class="force" x1="270.4" y1="279.7" x2="257.1" y2="333.1" marker-end="url(#ah-orange)"/>
  <line class="force" x1="281.3" y1="236.1" x2="294.6" y2="182.7" marker-end="url(#ah-orange)"/>
  <text x="266.0" y="261.0" class="sym t-orange" text-anchor="end">F</text>
  <line class="force" x1="278.0" y1="456.6" x2="278.0" y2="404.6" marker-end="url(#ah-orange)"/>
  <text x="288.0" y="448.6" class="sym t-orange">F<tspan dy="4" style="font-size:12.5px">t</tspan></text>
  <text x="450.0" y="112.0" class="note">body 1: airframe / drop carriage,</text>
  <text x="450.0" y="128.0" class="note">mass M, at height y₁; reference point</text>
  <text x="450.0" y="144.0" class="note">= strut attachment</text>
  <text x="450.0" y="196.0" class="note">strut axis e, raked β from vertical</text>
  <text x="450.0" y="212.0" class="note">gas + orifice + stop: force F along e</text>
  <text x="450.0" y="236.0" class="note">sliding joint: body 2 moves along e only;</text>
  <text x="450.0" y="252.0" class="note">stroke s (s &gt; 0 compresses)</text>
  <text x="450.0" y="290.0" class="note">body 2: piston, axle, wheel; mass m;</text>
  <text x="450.0" y="306.0" class="note">axle at (x₂, y₂)</text>
  <text x="450.0" y="330.0" class="note">tyre force F<tspan dy="4" style="font-size:12.5px">t</tspan><tspan dy="-4"> vertical, compression only</tspan></text>
  <line class="thin" x1="444.0" y1="300.0" x2="327.1" y2="332.3"/>
  <line class="axis" x1="40.0" y1="376.6" x2="84.0" y2="376.6" marker-end="url(#ah-blue)"/>
  <line class="axis" x1="40.0" y1="376.6" x2="40.0" y2="332.6" marker-end="url(#ah-blue)"/>
  <text x="88.0" y="381.6" class="sym t-blue">x</text>
  <text x="36.0" y="326.6" class="sym t-blue">y</text>
</svg>
