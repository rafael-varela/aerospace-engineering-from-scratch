<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" width="720" height="445" role="img" aria-labelledby="title">
  <title id="title">Wiring of the Option B bench: USB powers the board; two PWM pins drive the H-bridge inputs and a board output its enable; the H-bridge drives the gear motor, whose shaft turns a 10 kΩ pot through a silicone tube and carries a card pointer over a printed protractor; the pot wiper goes to an ADC pin; a stop button connects an input pin to ground; the AA pack (at most 6.0 V) feeds the H-bridge motor supply VM through a 0.5 A PTC fuse; all grounds are common.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="body" x="560.0" y="30.0" width="100.0" height="44.0" rx="6"/>
  <text x="610.0" y="57.0" text-anchor="middle">10 kΩ pot</text>
  <text x="610.0" y="20.0" class="note" text-anchor="middle">ends to board 3.3 V and GND</text>
  <line class="line" x1="606.0" y1="74.0" x2="606.0" y2="100.0"/>
  <line class="line" x1="614.0" y1="74.0" x2="614.0" y2="100.0"/>
  <rect class="body-2" x="596.0" y="100.0" width="28.0" height="26.0" rx="3"/>
  <text x="632.0" y="118.0" class="note">silicone tube</text>
  <line class="line" x1="606.0" y1="126.0" x2="606.0" y2="200.0"/>
  <line class="line" x1="614.0" y1="126.0" x2="614.0" y2="200.0"/>
  <text x="624.0" y="195.0" class="note">shaft</text>
  <path class="thin dash" d="M 563.0,182.1 A 50,50 0 0 1 601.3,115.8"/>
  <path class="thin dash" d="M 618.7,115.8 A 50,50 0 0 1 657.0,182.1"/>
  <line class="line" x1="610.0" y1="165.0" x2="562.0" y2="125.0"/>
  <circle class="dot-o" cx="610" cy="165" r="4.5"/>
  <text x="538.0" y="113.0" class="note" text-anchor="end">pointer arm (card)</text>
  <text x="538.0" y="130.0" class="note" text-anchor="end">over a printed protractor</text>
  <rect class="body" x="550.0" y="200.0" width="120.0" height="60.0" rx="28"/>
  <text x="610.0" y="235.0" text-anchor="middle">gear motor</text>
  <rect class="body-2" x="15.0" y="130.0" width="66.0" height="40.0" rx="4"/>
  <text x="48.0" y="155.0" class="head" text-anchor="middle">USB</text>
  <line class="line" x1="81.0" y1="150.0" x2="110.0" y2="150.0"/>
  <rect class="body" x="110.0" y="100.0" width="170.0" height="230.0" rx="4"/>
  <text x="124.0" y="126.0" class="head">board</text>
  <text x="118.0" y="155.0" class="note">USB</text>
  <text x="250.0" y="120.0" class="note" text-anchor="middle">ADC pin</text>
  <text x="272.0" y="180.0" class="note" text-anchor="end">PWM ×2</text>
  <text x="272.0" y="215.0" class="note" text-anchor="end">EN</text>
  <text x="272.0" y="265.0" class="note" text-anchor="end">input pin</text>
  <text x="272.0" y="310.0" class="note" text-anchor="end">GND</text>
  <path class="line" d="M560.0,52.0 L250.0,52.0 L250.0,100.0" marker-end="url(#ah-ink)"/>
  <text x="400.0" y="44.0" class="note" text-anchor="middle">wiper</text>
  <rect class="body" x="360.0" y="135.0" width="120.0" height="115.0" rx="4"/>
  <text x="420.0" y="157.0" class="head" text-anchor="middle">H-bridge</text>
  <text x="368.0" y="180.0" class="note">IN1, IN2</text>
  <text x="368.0" y="215.0" class="note">EN</text>
  <text x="385.0" y="242.0" class="note" text-anchor="middle">GND</text>
  <text x="455.0" y="242.0" class="note" text-anchor="middle">VM</text>
  <line class="line" x1="280.0" y1="175.0" x2="360.0" y2="175.0" marker-end="url(#ah-ink)"/>
  <line class="line" x1="280.0" y1="210.0" x2="360.0" y2="210.0" marker-end="url(#ah-ink)"/>
  <line class="line" x1="480.0" y1="230.0" x2="550.0" y2="230.0" marker-end="url(#ah-ink)"/>
  <text x="515.0" y="222.0" class="note" text-anchor="middle">M+, M−</text>
  <line class="line" x1="280.0" y1="260.0" x2="330.0" y2="260.0"/>
  <line class="line" x1="330.0" y1="260.0" x2="330.0" y2="270.0"/>
  <line class="line" x1="330.0" y1="270.0" x2="345.0" y2="288.0"/>
  <circle class="dot" cx="330.0" cy="270.0" r="3.5"/>
  <circle class="dot" cx="330.0" cy="292.0" r="3.5"/>
  <line class="line" x1="330.0" y1="292.0" x2="330.0" y2="360.0"/>
  <text x="344.0" y="274.0" class="note">stop</text>
  <text x="344.0" y="290.0" class="note">button</text>
  <line class="line" x1="280.0" y1="305.0" x2="330.0" y2="305.0"/>
  <circle class="dot" cx="330.0" cy="305.0" r="3.5"/>
  <path class="line" d="M385.0,250.0 L385.0,360.0"/>
  <line class="line" x1="330.0" y1="360.0" x2="430.0" y2="360.0"/>
  <circle class="dot" cx="385.0" cy="360.0" r="3.5"/>
  <text x="300.0" y="382.0" class="note" text-anchor="middle">common ground</text>
  <rect class="body-2" x="470.0" y="390.0" width="180.0" height="40.0" rx="4"/>
  <text x="560.0" y="415.0" text-anchor="middle">AA pack (≤ 6.0 V)</text>
  <text x="482.0" y="405.0" class="head">−</text>
  <text x="632.0" y="405.0" class="head">+</text>
  <path class="line" d="M470.0,410.0 L430.0,410.0 L430.0,360.0"/>
  <circle class="dot" cx="430.0" cy="360.0" r="3.5"/>
  <path class="line" d="M650.0,410.0 L700.0,410.0 L700.0,300.0 L455.0,300.0 L455.0,250.0"/>
  <rect class="body" x="540.0" y="288.0" width="76.0" height="24.0" rx="3"/>
  <text x="578.0" y="305.0" class="note" text-anchor="middle">PTC</text>
  <text x="578.0" y="330.0" class="note" text-anchor="middle">0.5 A resettable fuse</text>
</svg>
