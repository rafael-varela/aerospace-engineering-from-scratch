<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" width="720" height="395" role="img" aria-labelledby="title">
  <title id="title">A slice of beam between stations z and z + dz, cut again at height y1; the part above the cut has bending stresses σ(z) pushing on its left face and slightly larger stresses σ(z + dz) on its right face, both growing linearly with height above the neutral axis, and a shear force τ t dz along the cut face.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="body" x="260.0" y="90.0" width="200.0" height="100.0"/>
  <path class="thin dash" d="M260,190 V320 H460 V190"/>
  <line class="thin dash" x1="140.0" y1="245.0" x2="490.0" y2="245.0"/>
  <text x="134.0" y="237.0" class="note">neutral axis</text>
  <text x="360.0" y="136.0" text-anchor="middle">part above y₁</text>
  <text x="360.0" y="154.0" class="note" text-anchor="middle">(area A′)</text>
  <line class="force" x1="175.1" y1="98.0" x2="257.0" y2="98.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="578.7" y1="98.0" x2="463.0" y2="98.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="184.4" y1="114.8" x2="257.0" y2="114.8" marker-end="url(#ah-orange)"/>
  <line class="force" x1="565.6" y1="114.8" x2="463.0" y2="114.8" marker-end="url(#ah-orange)"/>
  <line class="force" x1="193.6" y1="131.6" x2="257.0" y2="131.6" marker-end="url(#ah-orange)"/>
  <line class="force" x1="552.5" y1="131.6" x2="463.0" y2="131.6" marker-end="url(#ah-orange)"/>
  <line class="force" x1="202.9" y1="148.4" x2="257.0" y2="148.4" marker-end="url(#ah-orange)"/>
  <line class="force" x1="539.3" y1="148.4" x2="463.0" y2="148.4" marker-end="url(#ah-orange)"/>
  <line class="force" x1="212.1" y1="165.2" x2="257.0" y2="165.2" marker-end="url(#ah-orange)"/>
  <line class="force" x1="526.2" y1="165.2" x2="463.0" y2="165.2" marker-end="url(#ah-orange)"/>
  <line class="force" x1="221.3" y1="182.0" x2="257.0" y2="182.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="513.1" y1="182.0" x2="463.0" y2="182.0" marker-end="url(#ah-orange)"/>
  <text x="180.0" y="76.0" class="sym t-orange" text-anchor="middle">σ(z)</text>
  <text x="550.0" y="76.0" class="sym t-orange" text-anchor="middle">σ(z + dz)</text>
  <line class="force" x1="310.0" y1="200.0" x2="410.0" y2="200.0" marker-end="url(#ah-orange)"/>
  <text x="360.0" y="222.0" class="sym t-orange" text-anchor="middle">τ t dz</text>
  <text x="480.0" y="212.0" class="note">cut at height y₁: shear τ</text>
  <text x="480.0" y="229.0" class="note">on the cut face (width t)</text>
  <text x="360.0" y="82.0" class="note" text-anchor="middle">top of section</text>
  <text x="254.0" y="50.0" text-anchor="middle">station z</text>
  <text x="466.0" y="50.0" text-anchor="middle">z + dz</text>
  <line class="thin" x1="260.0" y1="56.0" x2="260.0" y2="86.0"/>
  <line class="thin" x1="460.0" y1="56.0" x2="460.0" y2="86.0"/>
  <line class="thin" x1="260.0" y1="336.0" x2="460.0" y2="336.0" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="360.0" y="354.0" class="sym" text-anchor="middle">dz</text>
  <text x="360.0" y="380.0" class="note" text-anchor="middle">|σ(z + dz)| &gt; |σ(z)|: the net push on the part, dM · Q / I, is balanced by τ t dz.</text>
</svg>
