<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 438" width="720" height="438" role="img" aria-labelledby="title">
  <title id="title">Channel section with its web on the left and flanges pointing right, carrying a vertical shear S_y. The shear flow runs in from the bottom flange tip, up the web and out to the top flange tip, linear in the flanges and parabolic in the web; it gives a force F away from the web in the top flange, F toward the web in the bottom flange and S_y up in the web. The applied S_y acts at the shear centre, a distance e on the other side of the web.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body-2" d="M500.0,110.0 L300.0,110.0 L300.0,76.0 Z"/>
  <path class="body-2" d="M500.0,310.0 L300.0,310.0 L300.0,344.0 Z"/>
  <path class="body-2" d="M300.0,110.0 L340.0,110.0 L341.0,115.0 L341.9,120.0 L342.8,125.0 L343.6,130.0 L344.4,135.0 L345.1,140.0 L345.8,145.0 L346.4,150.0 L347.0,155.0 L347.5,160.0 L348.0,165.0 L348.4,170.0 L348.8,175.0 L349.1,180.0 L349.4,185.0 L349.6,190.0 L349.8,195.0 L349.9,200.0 L350.0,205.0 L350.0,210.0 L350.0,215.0 L349.9,220.0 L349.8,225.0 L349.6,230.0 L349.4,235.0 L349.1,240.0 L348.8,245.0 L348.4,250.0 L348.0,255.0 L347.5,260.0 L347.0,265.0 L346.4,270.0 L345.8,275.0 L345.1,280.0 L344.4,285.0 L343.6,290.0 L342.8,295.0 L341.9,300.0 L341.0,305.0 L340.0,310.0 L300.0,310.0 Z"/>
  <path class="line" style="stroke-width:6" d="M500,110 H300 V310 H500"/>
  <line class="flow" x1="470.0" y1="298.0" x2="350.0" y2="298.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="288.0" y1="270.0" x2="288.0" y2="150.0" marker-end="url(#ah-blue)"/>
  <line class="flow" x1="330.0" y1="122.0" x2="450.0" y2="122.0" marker-end="url(#ah-blue)"/>
  <text x="390.0" y="144.0" class="sym t-blue" text-anchor="middle">q</text>
  <line class="force" x1="340.0" y1="54.0" x2="470.0" y2="54.0" marker-end="url(#ah-orange)"/>
  <text x="478.0" y="60.0" class="sym t-orange">F</text>
  <line class="force" x1="470.0" y1="366.0" x2="340.0" y2="366.0" marker-end="url(#ah-orange)"/>
  <text x="478.0" y="372.0" class="sym t-orange">F</text>
  <line class="force" x1="390.0" y1="260.0" x2="390.0" y2="160.0" marker-end="url(#ah-orange)"/>
  <text x="400.0" y="174.0" class="sym t-orange">S<tspan dy="4" style="font-size:12.5px">y</tspan></text>
  <text x="400.0" y="194.0" class="note">web force</text>
  <text x="400.0" y="211.0" class="note">(parabolic flow)</text>
  <circle class="dot-o" cx="230.0" cy="210.0" r="5.0"/>
  <line class="force" x1="230.0" y1="210.0" x2="230.0" y2="130.0" marker-end="url(#ah-orange)"/>
  <text x="220.0" y="144.0" class="sym t-orange" text-anchor="end">S<tspan dy="4" style="font-size:12.5px">y</tspan></text>
  <text x="220.0" y="216.0" class="sym" text-anchor="end">S</text>
  <text x="222.0" y="262.0" class="note" text-anchor="end">shear centre</text>
  <line class="thin" x1="230.0" y1="228.0" x2="294.0" y2="228.0" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <line class="thin" x1="230.0" y1="216.0" x2="230.0" y2="236.0"/>
  <text x="265.0" y="246.0" class="sym" text-anchor="middle">e</text>
  <line class="thin" x1="530.0" y1="110.0" x2="530.0" y2="310.0" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <line class="thin" x1="506.0" y1="110.0" x2="536.0" y2="110.0"/>
  <line class="thin" x1="506.0" y1="310.0" x2="536.0" y2="310.0"/>
  <text x="538.0" y="215.0" class="sym">h</text>
  <text x="30.0" y="30.0" class="head">Channel under S<tspan dy="4" style="font-size:12.5px">y</tspan><tspan dy="-4">: flange forces F and web force S</tspan><tspan dy="4" style="font-size:12.5px">y</tspan></text>
  <text x="520.0" y="48.0" class="note">top flange: F away from the web</text>
  <text x="520.0" y="64.0" class="note">(flow linear: zero at the tip,</text>
  <text x="520.0" y="80.0" class="note">largest at the web)</text>
  <text x="520.0" y="372.0" class="note">bottom flange: F toward the web</text>
  <text x="506.0" y="115.0" class="note"></text>
  <text x="30.0" y="406.0" class="note">The flange forces form a couple F h, so the resultant of the flow acts a distance e from the web</text>
  <text x="30.0" y="423.0" class="note">with S<tspan dy="4" style="font-size:12.5px">y</tspan><tspan dy="-4"> e = F h, on the side away from the flanges: a load there bends the channel without twist.</tspan></text>
</svg>
