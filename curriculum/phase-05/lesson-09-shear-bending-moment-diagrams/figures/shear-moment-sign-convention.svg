<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" width="720" height="425" role="img" aria-labelledby="title">
  <title id="title">A beam cut at distance x from its left end into a left part and a right part. The left part carries an upward distributed load w(x) and the reaction R_A at its end; on its cut face the shear V acts downward and the moment M counterclockwise, and on the right part's face V acts upward and M clockwise. Below, a positive moment bends a beam concave up (sagging) and a negative one concave down (hogging).</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="body" x="70.0" y="128.0" width="230.0" height="36.0"/>
  <path class="body" d="M650,128 L460,128 L460,164 L650,164"/>
  <path class="thin" d="M650,124 q8,13.0 0,22.0 q-8,9.0 0,18.0"/>
  <text x="185.0" y="151.0" text-anchor="middle">left part</text>
  <text x="555.0" y="151.0" text-anchor="middle">right part</text>
  <line class="force" x1="100.0" y1="208.0" x2="100.0" y2="170.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="129.7" y1="208.0" x2="129.7" y2="170.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="159.3" y1="208.0" x2="159.3" y2="170.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="189.0" y1="208.0" x2="189.0" y2="170.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="218.7" y1="208.0" x2="218.7" y2="170.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="248.3" y1="208.0" x2="248.3" y2="170.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="278.0" y1="208.0" x2="278.0" y2="170.0" marker-end="url(#ah-orange)"/>
  <line class="thin" x1="100.0" y1="208.0" x2="278.0" y2="208.0"/>
  <text x="190.0" y="228.0" class="sym t-orange" text-anchor="middle">w(x), positive up</text>
  <line class="force" x1="72.0" y1="228.0" x2="72.0" y2="170.0" marker-end="url(#ah-orange)"/>
  <text x="64.0" y="224.0" class="sym t-orange" text-anchor="end">R<tspan dy="4" style="font-size:12.5px">A</tspan></text>
  <line class="thin" x1="70.0" y1="256.0" x2="300.0" y2="256.0" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <text x="185.0" y="274.0" class="sym" text-anchor="middle">x</text>
  <line class="thin dash" x1="300.0" y1="214.0" x2="300.0" y2="264.0"/>
  <path class="force" d="M319.0,178.9 A38,38 0 0 0 319.0,113.1" marker-end="url(#ah-orange)"/>
  <text x="344.0" y="116.0" class="sym t-orange">M</text>
  <line class="force" x1="309.0" y1="114.0" x2="309.0" y2="208.0" marker-end="url(#ah-orange)"/>
  <text x="316.0" y="208.0" class="sym t-orange">V</text>
  <path class="force" d="M441.0,178.9 A38,38 0 0 1 441.0,113.1" marker-end="url(#ah-orange)"/>
  <text x="416.0" y="116.0" class="sym t-orange" text-anchor="end">M</text>
  <line class="force" x1="451.0" y1="178.0" x2="451.0" y2="84.0" marker-end="url(#ah-orange)"/>
  <text x="444.0" y="94.0" class="sym t-orange" text-anchor="end">V</text>
  <text x="30.0" y="26.0" class="head">Positive V and M on the two faces of a cut at x</text>
  <text x="30.0" y="46.0" class="note">V on the left part is the sum of the upward forces on it; the right part pushes down on it with V.</text>
  <text x="30.0" y="63.0" class="note">Forces and w(x) positive up; applied couples positive counterclockwise.</text>
  <path class="body" d="M110,298 Q200,358 290,298 L290,322 Q200,382 110,322 Z"/>
  <path class="force" d="M97.0,333.6 A26,26 0 0 1 97.0,286.4" marker-end="url(#ah-orange)"/>
  <path class="force" d="M303.0,333.6 A26,26 0 0 0 303.0,286.4" marker-end="url(#ah-orange)"/>
  <text x="200.0" y="382.0" text-anchor="middle">M(x) &gt; 0: sagging</text>
  <text x="200.0" y="400.0" class="note" text-anchor="middle">concave up, top in compression</text>
  <path class="body" d="M440,298 Q530,238 620,298 L620,322 Q530,262 440,322 Z"/>
  <path class="force" d="M427.0,286.4 A26,26 0 0 0 427.0,333.6" marker-end="url(#ah-orange)"/>
  <path class="force" d="M633.0,286.4 A26,26 0 0 1 633.0,333.6" marker-end="url(#ah-orange)"/>
  <text x="530.0" y="382.0" text-anchor="middle">M(x) &lt; 0: hogging</text>
  <text x="530.0" y="400.0" class="note" text-anchor="middle">concave down, top in tension</text>
</svg>
