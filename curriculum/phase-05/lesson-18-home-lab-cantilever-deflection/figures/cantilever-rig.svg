<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title">
  <title id="title">Side view of the home cantilever rig: a strip lies flat side up on a table, held by a C-clamp near the table edge; x runs along the strip from the clamp edge; a bag of coins or water hangs on a string loop in a filed notch at a = 290 mm from the clamp edge, over a box or cushion with no feet underneath; a ruler stands vertically beside the strip end and is read from a phone photo at the strip’s height.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="ground" x="20.0" y="420.0" width="680.0" height="10.0"/>
  <line class="line" x1="20.0" y1="420.0" x2="700.0" y2="420.0"/>
  <rect class="body" x="20.0" y="176.0" width="190.0" height="26.0"/>
  <rect class="body" x="40.0" y="202.0" width="22.0" height="218.0"/>
  <text x="70.0" y="236.0">table</text>
  <rect class="body-2" x="110.0" y="170.0" width="515.0" height="6.0"/>
  <rect class="body" x="150.0" y="158.0" width="36.0" height="12.0"/>
  <line class="line" x1="168.0" y1="158.0" x2="168.0" y2="108.0"/>
  <line class="line" x1="152.0" y1="108.0" x2="184.0" y2="108.0"/>
  <rect class="body" x="150.0" y="202.0" width="36.0" height="12.0"/>
  <path class="thin dash" d="M168,108 H122 V220 H168 V214"/>
  <text x="30.0" y="36.0">C-clamp (frame behind the strip),</text>
  <text x="30.0" y="54.0" class="note">checked before each load</text>
  <line class="thin" x1="186.0" y1="150.0" x2="186.0" y2="168.0"/>
  <text x="190.0" y="146.0" class="note">clamp edge</text>
  <text x="260.0" y="194.0" class="note">strip, flat side up</text>
  <line class="axis" x1="186.0" y1="212.0" x2="256.0" y2="212.0" marker-end="url(#ah-blue)"/>
  <text x="262.0" y="217.0" class="sym t-blue">x</text>
  <path class="thin" d="M535,176 l5,-4 l5,4"/>
  <line class="thin" x1="540.0" y1="176.0" x2="540.0" y2="300.0"/>
  <path class="body" d="M514,300 h52 l10,46 h-72 Z"/>
  <text x="540.0" y="330.0" text-anchor="middle">bag</text>
  <text x="586.0" y="316.0" class="note">coins or water,</text>
  <text x="586.0" y="332.0" class="note">weighed</text>
  <text x="530.0" y="232.0" class="note" text-anchor="end">string loop in</text>
  <text x="530.0" y="248.0" class="note" text-anchor="end">a filed notch</text>
  <line class="thin" x1="186.0" y1="134.0" x2="540.0" y2="134.0" marker-end="url(#ah-ink2)" marker-start="url(#ah-ink2)"/>
  <line class="thin" x1="540.0" y1="126.0" x2="540.0" y2="164.0"/>
  <text x="363.0" y="126.0" text-anchor="middle">a = 290 mm from the clamp edge</text>
  <rect class="body-2" x="470.0" y="380.0" width="140.0" height="40.0"/>
  <text x="540.0" y="405.0" class="note" text-anchor="middle">box or cushion</text>
  <line class="thin dash" x1="540.0" y1="350.0" x2="540.0" y2="374.0" marker-end="url(#ah-ink2)"/>
  <text x="460.0" y="400.0" class="note" text-anchor="end">no feet underneath</text>
  <rect class="body" x="652.0" y="90.0" width="18.0" height="200.0"/>
  <line class="thin" x1="652.0" y1="94.0" x2="661.0" y2="94.0"/>
  <line class="thin" x1="652.0" y1="103.6" x2="657.0" y2="103.6"/>
  <line class="thin" x1="652.0" y1="113.2" x2="657.0" y2="113.2"/>
  <line class="thin" x1="652.0" y1="122.8" x2="657.0" y2="122.8"/>
  <line class="thin" x1="652.0" y1="132.4" x2="657.0" y2="132.4"/>
  <line class="thin" x1="652.0" y1="142.0" x2="661.0" y2="142.0"/>
  <line class="thin" x1="652.0" y1="151.6" x2="657.0" y2="151.6"/>
  <line class="thin" x1="652.0" y1="161.2" x2="657.0" y2="161.2"/>
  <line class="thin" x1="652.0" y1="170.8" x2="657.0" y2="170.8"/>
  <line class="thin" x1="652.0" y1="180.4" x2="657.0" y2="180.4"/>
  <line class="thin" x1="652.0" y1="190.0" x2="661.0" y2="190.0"/>
  <line class="thin" x1="652.0" y1="199.6" x2="657.0" y2="199.6"/>
  <line class="thin" x1="652.0" y1="209.2" x2="657.0" y2="209.2"/>
  <line class="thin" x1="652.0" y1="218.8" x2="657.0" y2="218.8"/>
  <line class="thin" x1="652.0" y1="228.4" x2="657.0" y2="228.4"/>
  <line class="thin" x1="652.0" y1="238.0" x2="661.0" y2="238.0"/>
  <line class="thin" x1="652.0" y1="247.6" x2="657.0" y2="247.6"/>
  <line class="thin" x1="652.0" y1="257.2" x2="657.0" y2="257.2"/>
  <line class="thin" x1="652.0" y1="266.8" x2="657.0" y2="266.8"/>
  <line class="thin" x1="652.0" y1="276.4" x2="657.0" y2="276.4"/>
  <line class="thin" x1="652.0" y1="286.0" x2="661.0" y2="286.0"/>
  <text x="619.0" y="164.0" class="note" text-anchor="end">end</text>
  <text x="692.0" y="36.0" class="note" text-anchor="end">ruler held vertical beside the strip end,</text>
  <text x="692.0" y="52.0" class="note" text-anchor="end">read from a phone photo at the strip’s height</text>
</svg>
