<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="title">
  <title id="title">The piece of wing outboard of a cut at span station y, out to the tip at y = s, with the lift w(η) acting upward along it and falling to zero at the tip; on the cut face the inboard wing exerts a downward shear force V and a clockwise bending moment M.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <rect class="body" x="170.0" y="160.0" width="470.0" height="36.0"/>
  <line class="force" x1="170.0" y1="157.0" x2="170.0" y2="66.4" marker-end="url(#ah-orange)"/>
  <line class="force" x1="217.0" y1="157.0" x2="217.0" y2="68.7" marker-end="url(#ah-orange)"/>
  <line class="force" x1="264.0" y1="157.0" x2="264.0" y2="71.7" marker-end="url(#ah-orange)"/>
  <line class="force" x1="311.0" y1="157.0" x2="311.0" y2="75.3" marker-end="url(#ah-orange)"/>
  <line class="force" x1="358.0" y1="157.0" x2="358.0" y2="79.6" marker-end="url(#ah-orange)"/>
  <line class="force" x1="405.0" y1="157.0" x2="405.0" y2="84.8" marker-end="url(#ah-orange)"/>
  <line class="force" x1="452.0" y1="157.0" x2="452.0" y2="91.1" marker-end="url(#ah-orange)"/>
  <line class="force" x1="499.0" y1="157.0" x2="499.0" y2="98.8" marker-end="url(#ah-orange)"/>
  <line class="force" x1="546.0" y1="157.0" x2="546.0" y2="108.5" marker-end="url(#ah-orange)"/>
  <line class="force" x1="593.0" y1="157.0" x2="593.0" y2="122.1" marker-end="url(#ah-orange)"/>
  <path class="thin" d="M170.0,66.4 L177.8,66.7 L185.7,67.1 L193.5,67.5 L201.3,67.9 L209.2,68.3 L217.0,68.7 L224.8,69.2 L232.7,69.7 L240.5,70.1 L248.3,70.6 L256.2,71.2 L264.0,71.7 L271.8,72.2 L279.7,72.8 L287.5,73.4 L295.3,74.0 L303.2,74.6 L311.0,75.3 L318.8,76.0 L326.7,76.6 L334.5,77.3 L342.3,78.1 L350.2,78.8 L358.0,79.6 L365.8,80.4 L373.7,81.2 L381.5,82.1 L389.3,83.0 L397.2,83.9 L405.0,84.8 L412.8,85.8 L420.7,86.8 L428.5,87.8 L436.3,88.8 L444.2,89.9 L452.0,91.1 L459.8,92.2 L467.7,93.5 L475.5,94.7 L483.3,96.0 L491.2,97.4 L499.0,98.8 L506.8,100.2 L514.7,101.7 L522.5,103.3 L530.3,105.0 L538.2,106.7 L546.0,108.5 L553.8,110.4 L561.7,112.5 L569.5,114.6 L577.3,116.9 L585.2,119.4 L593.0,122.1 L600.8,125.0 L608.7,128.3 L616.5,132.1 L624.3,136.6 L632.2,142.5 L640.0,157.0"/>
  <text x="337.9" y="51.7" class="sym t-orange">lift w(η) on the outboard piece</text>
  <line class="force" x1="162.0" y1="140.0" x2="162.0" y2="242.0" marker-end="url(#ah-orange)"/>
  <text x="152.0" y="240.0" class="sym t-orange" text-anchor="end">V</text>
  <path class="force" d="M141.4,214.5 A44,44 0 0 1 141.4,141.5" marker-end="url(#ah-orange)"/>
  <text x="122.0" y="144.0" class="sym t-orange" text-anchor="end">M</text>
  <line class="thin dash" x1="170.0" y1="200.0" x2="170.0" y2="266.0"/>
  <text x="170.0" y="284.0" text-anchor="middle">cut at y</text>
  <line class="thin dash" x1="640.0" y1="200.0" x2="640.0" y2="266.0"/>
  <text x="640.0" y="284.0" text-anchor="middle">tip, y = s</text>
  <line class="axis" x1="190.0" y1="236.0" x2="330.0" y2="236.0" marker-end="url(#ah-blue)"/>
  <text x="336.0" y="241.0" class="sym t-blue">η</text>
  <text x="360.0" y="26.0" class="head" text-anchor="middle">Free-body diagram of the wing outboard of station y</text>
  <text x="360.0" y="314.0" class="note" text-anchor="middle">V and M are the forces the inboard wing exerts on the outboard piece.</text>
</svg>
