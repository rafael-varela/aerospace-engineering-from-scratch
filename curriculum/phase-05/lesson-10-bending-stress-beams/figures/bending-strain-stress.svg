<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 315" width="720" height="315" role="img" aria-labelledby="title">
  <title id="title">An I-spar cross-section with y measured up from the neutral axis, from y = +c at the top to y = −c at the bottom, beside the strain ε = −κy and the stress σ = −Eκy across the depth: both are linear in y, zero on the neutral axis, compressive (shortening) at the top cap and tensile (stretching) at the bottom cap under a sagging moment.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M70.0,80 h120 v18 h-56.0 V262 h56.0 v18 h-120 v-18 h56.0 V98 h-56.0 Z"/>
  <line class="thin dash" x1="30.0" y1="180.0" x2="690.0" y2="180.0"/>
  <line class="axis" x1="130.0" y1="304.0" x2="130.0" y2="50.0" marker-end="url(#ah-blue)"/>
  <text x="138.0" y="58.0" class="sym t-blue">y</text>
  <text x="200.0" y="94.0">y = +c</text>
  <text x="200.0" y="276.0">y = −c</text>
  <text x="200.0" y="172.0">y = 0</text>
  <text x="130.0" y="34.0" class="head" text-anchor="middle">section (I-spar)</text>
  <line class="line" x1="350.0" y1="80.0" x2="350.0" y2="280.0"/>
  <path class="body-2" d="M350.0,80.0 L280.0,80.0 L420.0,280.0 L350.0,280.0 Z"/>
  <line class="axis" x1="280.0" y1="80.0" x2="420.0" y2="280.0"/>
  <text x="350.0" y="34.0" class="head" text-anchor="middle">strain ε = −κy</text>
  <text x="274.0" y="72.0" class="note">shortens</text>
  <text x="428.0" y="285.0" class="note">stretches</text>
  <line class="line" x1="560.0" y1="80.0" x2="560.0" y2="280.0"/>
  <line class="force" x1="560.0" y1="80.0" x2="480.0" y2="80.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="100.0" x2="496.0" y2="100.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="120.0" x2="512.0" y2="120.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="140.0" x2="528.0" y2="140.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="160.0" x2="544.0" y2="160.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="200.0" x2="576.0" y2="200.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="220.0" x2="592.0" y2="220.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="240.0" x2="608.0" y2="240.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="260.0" x2="624.0" y2="260.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="560.0" y1="280.0" x2="640.0" y2="280.0" marker-end="url(#ah-orange)"/>
  <line class="thin" x1="480.0" y1="80.0" x2="640.0" y2="280.0"/>
  <text x="560.0" y="34.0" class="head" text-anchor="middle">stress σ = −Eκy</text>
  <text x="474.0" y="70.0" class="t-orange">compression (top cap)</text>
  <text x="644.0" y="302.0" class="t-orange" text-anchor="end">tension (bottom cap)</text>
  <text x="196.0" y="202.0" class="note">neutral axis:</text>
  <text x="196.0" y="219.0" class="note">no strain,</text>
  <text x="196.0" y="236.0" class="note">no stress</text>
</svg>
