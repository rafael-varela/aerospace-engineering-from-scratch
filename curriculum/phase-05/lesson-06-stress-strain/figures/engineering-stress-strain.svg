<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-labelledby="title">
  <title id="title">Engineering stress against strain for an aluminium alloy coupon: a straight elastic line of slope E from the origin, a gradual knee where the 0.2 % offset line (also of slope E, starting at strain 0.002) cuts the curve at the yield strength Fty, a maximum at the ultimate strength Ftu at strain ε_u, then a falling necking branch to fracture at ε_f.</title>
