<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="title">
  <title id="title">Three beams and their boundary conditions: a cantilever clamped at the left (w = w′ = 0) and free at the tip (M = V = 0) under an upward load q, deflecting upward by w; a pinned–pinned beam with w = 0 and M = 0 at both ends; and a propped beam clamped at the left (w = w′ = 0) and pinned at the right (w = 0, M = 0).</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <text x="132.5" y="30.0" class="head" text-anchor="middle">clamped – free (cantilever)</text>
  <rect class="ground" x="36.0" y="80.0" width="14.0" height="80.0"/>
  <line class="line" x1="50.0" y1="80.0" x2="50.0" y2="160.0"/>
  <rect class="body" x="50.0" y="115.0" width="165.0" height="10.0"/>
  <path class="thin dash" d="M50,120 Q162.5,120 215,86"/>
  <line class="force" x1="80.0" y1="160.0" x2="80.0" y2="127.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="105.0" y1="160.0" x2="105.0" y2="127.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="127.0" y1="160.0" x2="127.0" y2="127.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="155.0" y1="160.0" x2="155.0" y2="127.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="180.0" y1="160.0" x2="180.0" y2="127.0" marker-end="url(#ah-orange)"/>
  <line class="force" x1="205.0" y1="160.0" x2="205.0" y2="127.0" marker-end="url(#ah-orange)"/>
  <line class="thin" x1="80.0" y1="160.0" x2="205.0" y2="160.0"/>
  <text x="70.0" y="176.0" class="sym t-orange">q</text>
  <line class="axis" x1="229.0" y1="116.0" x2="229.0" y2="76.0" marker-end="url(#ah-blue)"/>
  <text x="235.0" y="90.0" class="sym t-blue">w</text>
  <text x="211.0" y="72.0" class="note" text-anchor="middle">tip</text>
  <text x="40.0" y="204.0" class="sym">w = w′ = 0</text>
  <text x="126.0" y="204.0" class="note">at the clamp</text>
  <text x="40.0" y="230.0" class="sym">M = V = 0</text>
  <text x="126.0" y="230.0" class="note">at the free end</text>
  <text x="370.0" y="30.0" class="head" text-anchor="middle">pinned – pinned</text>
  <rect class="body" x="290.0" y="115.0" width="160.0" height="10.0"/>
  <path class="body" d="M295.0,125.0 L284.6,140.6 L305.4,140.6 Z"/>
  <rect class="ground" x="276.8" y="140.6" width="36.4" height="8.0"/>
  <line class="line" x1="276.8" y1="140.6" x2="313.2" y2="140.6"/>
  <circle class="body" cx="295.0" cy="125.0" r="3.5"/>
  <path class="body" d="M445.0,125.0 L434.6,140.6 L455.4,140.6 Z"/>
  <rect class="ground" x="426.8" y="140.6" width="36.4" height="8.0"/>
  <line class="line" x1="426.8" y1="140.6" x2="463.2" y2="140.6"/>
  <circle class="body" cx="445.0" cy="125.0" r="3.5"/>
  <text x="370.0" y="204.0" class="sym" text-anchor="middle">w = 0, M = 0</text>
  <text x="370.0" y="222.0" class="note" text-anchor="middle">at both ends</text>
  <text x="612.5" y="30.0" class="head" text-anchor="middle">clamped – pinned (propped)</text>
  <rect class="ground" x="511.0" y="80.0" width="14.0" height="80.0"/>
  <line class="line" x1="525.0" y1="80.0" x2="525.0" y2="160.0"/>
  <rect class="body" x="525.0" y="115.0" width="165.0" height="10.0"/>
  <path class="body" d="M685.0,125.0 L674.6,140.6 L695.4,140.6 Z"/>
  <rect class="ground" x="666.8" y="140.6" width="36.4" height="8.0"/>
  <line class="line" x1="666.8" y1="140.6" x2="703.2" y2="140.6"/>
  <circle class="body" cx="685.0" cy="125.0" r="3.5"/>
  <text x="515.0" y="204.0" class="sym">w = w′ = 0</text>
  <text x="601.0" y="204.0" class="note">at the clamp</text>
  <text x="515.0" y="230.0" class="sym">w = 0, M = 0</text>
  <text x="613.0" y="230.0" class="note">at the pin</text>
  <line class="thin dash" x1="255.0" y1="50.0" x2="255.0" y2="235.0"/>
  <line class="thin dash" x1="490.0" y1="50.0" x2="490.0" y2="235.0"/>
</svg>
