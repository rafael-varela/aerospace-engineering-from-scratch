<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="title">
  <title id="title">Mohr's circle in the σ–τ plane with τ for the x face plotted upward: centre C on the σ axis, radius R; the x face is the point X (σx, τxy) and the y face the diametrically opposite point Y (σy, −τxy); the circle crosses the σ axis at the principal stresses σ2 and σ1, and the angle from CX to the σ1 point is 2θp.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <line class="axis" x1="120.0" y1="210.0" x2="650.0" y2="210.0" marker-end="url(#ah-blue)"/>
  <text x="656.0" y="215.0" class="sym t-blue">σ</text>
  <line class="axis" x1="120.0" y1="380.0" x2="120.0" y2="30.0" marker-end="url(#ah-blue)"/>
  <text x="130.0" y="34.0" class="sym t-blue">τ</text>
  <text x="144.0" y="34.0" class="note">(x face plotted upward)</text>
  <circle class="line" cx="390.0" cy="210.0" r="140.0"/>
  <line class="thin" x1="464.2" y1="91.3" x2="315.8" y2="328.7"/>
  <line class="thin dash" x1="464.2" y1="91.3" x2="464.2" y2="210.0"/>
  <line class="thin dash" x1="315.8" y1="328.7" x2="315.8" y2="210.0"/>
  <path class="thin" d="M415.4,169.3 A48,48 0 0 1 437.9,207.5" marker-end="url(#ah-ink2)"/>
  <text x="439.0" y="186.0" class="sym">2θ<tspan dy="4" style="font-size:12.5px">p</tspan></text>
  <circle class="dot-o" cx="464.2" cy="91.3" r="4.5"/>
  <circle class="dot-o" cx="315.8" cy="328.7" r="4.5"/>
  <circle class="dot" cx="250.0" cy="210.0" r="4.0"/>
  <circle class="dot" cx="390.0" cy="210.0" r="4.0"/>
  <circle class="dot" cx="530.0" cy="210.0" r="4.0"/>
  <text x="474.2" y="83.3" class="sym">X (σ<tspan dy="4" style="font-size:12.5px">x</tspan><tspan dy="-4">, τ</tspan><tspan dy="4" style="font-size:12.5px">xy</tspan><tspan dy="-4">)</tspan></text>
  <text x="305.8" y="350.7" class="sym" text-anchor="end">Y (σ<tspan dy="4" style="font-size:12.5px">y</tspan><tspan dy="-4">, −τ</tspan><tspan dy="4" style="font-size:12.5px">xy</tspan><tspan dy="-4">)</tspan></text>
  <text x="244.0" y="232.0" class="sym" text-anchor="end">σ₂</text>
  <text x="536.0" y="232.0" class="sym">σ₁</text>
  <text x="384.0" y="232.0" class="sym" text-anchor="end">C</text>
  <text x="417.1" y="146.6" class="sym" text-anchor="end">R</text>
  <text x="660.0" y="388.0" class="note" text-anchor="end">C = (σ<tspan dy="4" style="font-size:12.5px">x</tspan><tspan dy="-4"> + σ</tspan><tspan dy="4" style="font-size:12.5px">y</tspan><tspan dy="-4">)/2,  R = √(((σ</tspan><tspan dy="4" style="font-size:12.5px">x</tspan><tspan dy="-4"> − σ</tspan><tspan dy="4" style="font-size:12.5px">y</tspan><tspan dy="-4">)/2)² + τ</tspan><tspan dy="4" style="font-size:12.5px">xy</tspan><tspan dy="-4">²)</tspan></text>
</svg>
