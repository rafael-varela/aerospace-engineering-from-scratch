<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title">
  <title id="title">A triangular wedge OAB of skin with x axial and y hoop. The cut face AB, of length dA, has outward normal n at angle θ from x and carries σ_{x′} along n and τ_{x′y′} along AB; the −x face OB, of length dA cos θ, carries σ_x toward −x and τ_{xy} toward −y; the −y face OA, of length dA sin θ, carries σ_y toward −y and τ_{xy} toward −x.</title>
  <style>
    svg { --ink: #0f1620; --ink-2: #4a5666; --rule: #c9d1db; --blue: #214f7e; --orange: #d9571a; --fill: #e7ebf0; --fill-2: #d9e4f0; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e8edf4; --ink-2: #9aa7b8; --rule: #3a4757; --blue: #8db2db; --orange: #ff7a3d; --fill: #182231; --fill-2: #16263a; }
    }
    text { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: var(--ink); }
    .sym { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; }
    .note { font-size: 12.5px; fill: var(--ink-2); }
    .head { font-weight: 700; font-size: 14px; }
    .t-blue { fill: var(--blue); } .t-orange { fill: var(--orange); }
    .line { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--ink-2); stroke-width: 1.25; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .axis { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .force { stroke: var(--orange); stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .flow { stroke: var(--blue); stroke-width: 1.5; fill: none; }
    .body { fill: var(--fill); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
    .body-2 { fill: var(--fill-2); stroke: var(--blue); stroke-width: 1.5; }
    .ground { fill: url(#hatch); stroke: none; }
    .dot { fill: var(--ink); } .dot-o { fill: var(--orange); }
    .ah-ink { fill: var(--ink); } .ah-blue { fill: var(--blue); } .ah-orange { fill: var(--orange); } .ah-ink2 { fill: var(--ink-2); }
    .hatch-line { stroke: var(--ink-2); stroke-width: 1; }
  </style>
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ink" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-ink2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ink2" d="M0,0 L10,5 L0,10 z"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line" x1="0" y1="0" x2="0" y2="8"/></pattern>
  </defs>
  <path class="body" d="M190.0,330.0 L315.0,330.0 L190.0,113.5 Z"/>
  <line class="axis" x1="190.0" y1="330.0" x2="410.0" y2="330.0" marker-end="url(#ah-blue)"/>
  <text x="410.0" y="354.0" class="t-blue" text-anchor="end">x (axial)</text>
  <line class="axis" x1="190.0" y1="330.0" x2="190.0" y2="53.5" marker-end="url(#ah-blue)"/>
  <text x="198.0" y="61.5" class="t-blue">y (hoop)</text>
  <line class="force" x1="252.5" y1="221.7" x2="326.1" y2="179.2" marker-end="url(#ah-orange)"/>
  <text x="322.1" y="205.2" class="sym t-orange">σ<tspan dy="4" style="font-size:12.5px">x′</tspan></text>
  <line class="force" x1="262.9" y1="215.7" x2="227.9" y2="155.1" marker-end="url(#ah-orange)"/>
  <text x="237.9" y="153.1" class="sym t-orange">τ<tspan dy="4" style="font-size:12.5px">x′y′</tspan></text>
  <line class="thin dash" x1="326.1" y1="179.2" x2="382.4" y2="146.7"/>
  <text x="387.6" y="145.7" class="sym">n</text>
  <line class="thin dash" x1="252.5" y1="221.7" x2="377.5" y2="221.7"/>
  <path class="thin" d="M362.5,221.7 A110,110 0 0 0 347.8,166.7"/>
  <text x="368.5" y="199.7" class="sym">θ</text>
  <line class="force" x1="186.0" y1="201.7" x2="110.0" y2="201.7" marker-end="url(#ah-orange)"/>
  <text x="106.0" y="195.7" class="sym t-orange" text-anchor="end">σ<tspan dy="4" style="font-size:12.5px">x</tspan></text>
  <line class="force" x1="176.0" y1="231.7" x2="176.0" y2="301.7" marker-end="url(#ah-orange)"/>
  <text x="168.0" y="293.7" class="sym t-orange" text-anchor="end">τ<tspan dy="4" style="font-size:12.5px">xy</tspan></text>
  <line class="force" x1="272.5" y1="334.0" x2="272.5" y2="400.0" marker-end="url(#ah-orange)"/>
  <text x="280.5" y="396.0" class="sym t-orange">σ<tspan dy="4" style="font-size:12.5px">y</tspan></text>
  <line class="force" x1="242.5" y1="346.0" x2="172.5" y2="346.0" marker-end="url(#ah-orange)"/>
  <text x="168.5" y="368.0" class="sym t-orange" text-anchor="end">τ<tspan dy="4" style="font-size:12.5px">xy</tspan></text>
  <text x="180.0" y="322.0" class="sym" text-anchor="end">O</text>
  <text x="319.0" y="320.0" class="sym">A</text>
  <text x="180.0" y="117.5" class="sym" text-anchor="end">B</text>
  <text x="432.0" y="194.0" class="note">AB: the cut face, length dA, normal n</text>
  <text x="432.0" y="210.0" class="note">at θ from x; carries σ<tspan dy="4" style="font-size:12.5px">x′</tspan><tspan dy="-4"> (along n)</tspan></text>
  <text x="432.0" y="226.0" class="note">and τ<tspan dy="4" style="font-size:12.5px">x′y′</tspan><tspan dy="-4"> (along AB)</tspan></text>
  <text x="432.0" y="256.0" class="note">OB: the −x face, length dA cos θ;</text>
  <text x="432.0" y="272.0" class="note">carries σ<tspan dy="4" style="font-size:12.5px">x</tspan><tspan dy="-4"> (toward −x) and τ</tspan><tspan dy="4" style="font-size:12.5px">xy</tspan><tspan dy="-4"> (toward −y)</tspan></text>
  <text x="432.0" y="302.0" class="note">OA: the −y face, length dA sin θ;</text>
  <text x="432.0" y="318.0" class="note">carries σ<tspan dy="4" style="font-size:12.5px">y</tspan><tspan dy="-4"> (toward −y) and τ</tspan><tspan dy="4" style="font-size:12.5px">xy</tspan><tspan dy="-4"> (toward −x)</tspan></text>
</svg>
