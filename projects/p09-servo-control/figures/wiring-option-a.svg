  <circle class="dot" cx="330.0" cy="150.0" r="3.5"/>
  <rect class="body" x="40.0" y="200.0" width="160.0" height="250.0" rx="6"/>
  <text x="110.0" y="226.0" class="head" text-anchor="middle">board</text>
  <text x="190.0" y="235.0" class="note" text-anchor="end">GND</text>
